<title>Shadowgate: The Dark Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@1&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04040C;--panel:#09091A;--stone:#141220;--amber:#D97A08;--blood:#7A1515;--parch:#C8BC9A;--dim:#6A6055;--border:#2E2840;--hi:#F0A030}
html,body{width:100%;height:100%;background:var(--bg);color:var(--parch);font-family:'Cinzel',serif;overflow:hidden;user-select:none}
#shell{display:grid;grid-template-columns:1fr 200px;grid-template-rows:34px 1fr auto auto 42px;width:100%;height:100vh;max-width:1080px;margin:0 auto}

/* Title bar */
#bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
#gtitle{font-family:'Cinzel Decorative',serif;font-size:.9rem;letter-spacing:.12em;color:var(--amber);text-shadow:0 0 16px rgba(217,122,8,.5)}
#hud{display:flex;gap:16px;font-size:.65rem;letter-spacing:.07em}
.hstat{display:flex;align-items:center;gap:5px;color:var(--dim)}
.hval{color:var(--parch);font-weight:600}

/* 3D View */
#vwrap{position:relative;background:#000;overflow:hidden;border-right:1px solid var(--border)}
#cv{display:block;width:100%;height:100%}
#rname{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:.72rem;letter-spacing:.18em;font-weight:600;color:var(--parch);text-shadow:0 0 10px rgba(217,122,8,.4);pointer-events:none;border-bottom:1px solid #3A2E06;padding:2px 10px}
#ritual{position:absolute;top:0;left:0;right:0;height:3px;display:none}
#ritual-fill{height:3px;background:var(--blood);width:100%;transition:width .5s}

/* Right sidebar */
#sidebar{background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--border)}
#inv-hdr{padding:6px 10px;font-size:.58rem;letter-spacing:.16em;color:var(--dim);border-bottom:1px solid var(--border);text-transform:uppercase}
#inv{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;overflow-y:auto;align-content:start}
.islot{aspect-ratio:1;background:var(--stone);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:border-color .12s;padding:3px}
.islot:hover,.islot.sel{border-color:var(--amber)}
.islot.sel{background:#180F28;box-shadow:0 0 6px rgba(217,122,8,.3) inset}
.iico{font-size:1.25rem;line-height:1}.ilbl{font-size:.44rem;letter-spacing:.04em;color:var(--dim);text-align:center;line-height:1.2}

/* Room objects list */
#objwrap{grid-column:1/-1;background:var(--stone);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 10px;min-height:54px}
#objtitle{font-size:.58rem;letter-spacing:.14em;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
#objlist{display:flex;flex-wrap:wrap;gap:5px}
.obj{padding:4px 10px;background:var(--panel);border:1px solid var(--border);font-size:.68rem;letter-spacing:.08em;cursor:pointer;transition:border-color .12s,color .12s}
.obj:hover,.obj.sel{border-color:var(--amber);color:var(--amber)}

/* Log */
#log{grid-column:1/-1;background:#050510;padding:7px 13px;overflow-y:auto;font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;line-height:1.6;color:var(--parch);height:120px}
#log p{margin:0;padding:1px 0}
#log p.sys{color:var(--dim);font-style:normal;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.06em}
#log p.bad{color:#902020}#log p.good{color:#A07820}#log p.warn{color:#804010}
#log::-webkit-scrollbar{width:3px}#log::-webkit-scrollbar-thumb{background:var(--border)}

/* Bottom bar: verbs + compass */
#bottom{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--panel);border-top:1px solid var(--border)}
.verb{padding:4px 10px;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.09em;cursor:pointer;transition:all .12s;height:28px}
.verb:hover,.verb.active{border-color:var(--amber);color:var(--amber);background:rgba(217,122,8,.06)}
#verb-sep{flex:1}
#compass{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,22px);gap:2px;margin-right:4px}
.cdir{background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.6rem;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.cdir:hover{border-color:var(--amber);color:var(--amber);background:rgba(217,122,8,.08)}
.cdir.lit{border-color:#2A3060;color:#4060A0}
.cdir.blank{visibility:hidden}

/* Overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .7s;z-index:20}
.overlay.show{opacity:1;pointer-events:all}
#death-scr{background:rgba(0,0,0,.92)}
#death-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.8rem;color:var(--blood);text-shadow:0 0 28px rgba(140,20,20,.9);letter-spacing:.15em}
#death-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:var(--dim);max-width:480px;text-align:center;line-height:1.8}
#win-scr{background:rgba(0,0,0,.94)}
#win-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--amber);text-shadow:0 0 36px rgba(217,122,8,.9);letter-spacing:.12em}
#win-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.85rem;color:var(--parch);max-width:500px;text-align:center;line-height:1.85;white-space:pre-line}
#ep2-scr{background:rgba(0,0,0,.97)}
#ep2-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:var(--blood);letter-spacing:.14em;text-shadow:0 0 24px rgba(140,20,20,.8)}
#ep2-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.85rem;color:var(--dim);max-width:420px;text-align:center;line-height:1.8}
.rbtn{padding:6px 22px;background:transparent;border:1px solid currentColor;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.12em;cursor:pointer;transition:all .2s}
.rbtn.blood{color:var(--blood)}.rbtn.blood:hover{background:var(--blood);color:#fff}
.rbtn.amber{color:var(--amber)}.rbtn.amber:hover{background:var(--amber);color:#000}

/* Spell modal */
#spell-m{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#07071A;border:1px solid var(--border);padding:12px 18px;z-index:30;min-width:160px;display:none}
.spell-opt{padding:6px 12px;font-size:.68rem;letter-spacing:.09em;cursor:pointer;color:var(--parch);transition:background .12s}
.spell-opt:hover{background:rgba(217,122,8,.12);color:var(--amber)}
</style>

<div id="shell">
<div id="bar">
  <div id="gtitle">Shadowgate: The Dark Ascent</div>
  <div id="hud">
    <div class="hstat">TORCH <span id="h-ticon">🔥</span><span class="hval" id="h-tpct">100%</span></div>
    <div class="hstat">SPARE <span class="hval" id="h-tct">0</span></div>
    <div class="hstat">TURNS <span class="hval" id="h-turns">0</span></div>
    <div class="hstat" id="h-ep" style="display:none">EP <span class="hval" id="h-epn">I</span></div>
  </div>
</div>

<div id="vwrap">
  <canvas id="cv"></canvas>
  <div id="rname">—</div>
  <div id="ritual"><div id="ritual-fill"></div></div>
  <div class="overlay" id="death-scr">
    <h2>YOU HAVE DIED</h2>
    <p id="death-msg"></p>
    <button class="rbtn blood" onclick="startGame()">TRY AGAIN</button>
  </div>
  <div class="overlay" id="win-scr">
    <h2>VICTORY</h2>
    <p id="win-msg"></p>
    <button class="rbtn amber" onclick="startGame()">PLAY AGAIN</button>
  </div>
  <div class="overlay" id="ep2-scr">
    <h2>SHADOWGATE II</h2>
    <p>The floor gives way. You fall.<br><br>Below Shadowgate, something older has been waiting.</p>
  </div>
  <div id="spell-m">
    <div style="color:var(--amber);font-size:.65rem;letter-spacing:.14em;margin-bottom:8px">CAST SPELL</div>
    <div class="spell-opt" onclick="castSpell('OPEN')">OPEN</div>
    <div class="spell-opt" onclick="castSpell('BIND')">BIND</div>
    <div class="spell-opt" onclick="castSpell('SUMMON')">SUMMON</div>
    <div class="spell-opt" onclick="castSpell('DESTROY')">DESTROY</div>
    <div class="spell-opt" style="color:var(--dim);margin-top:4px" onclick="closeSpell()">cancel</div>
  </div>
</div>

<div id="sidebar">
  <div id="inv-hdr">Inventory</div>
  <div id="inv"></div>
</div>

<div id="objwrap">
  <div id="objtitle">Objects in room</div>
  <div id="objlist"></div>
</div>

<div id="log"></div>

<div id="bottom">
  <button class="verb active" data-v="look">LOOK</button>
  <button class="verb" data-v="take">TAKE</button>
  <button class="verb" data-v="use">USE</button>
  <button class="verb" data-v="open">OPEN</button>
  <button class="verb" data-v="cast">CAST</button>
  <div id="verb-sep"></div>
  <div id="compass">
    <div class="cdir blank"></div>
    <div class="cdir" id="cn" onclick="go('n')" title="North">N</div>
    <div class="cdir" id="cu" onclick="go('u')" title="Up">U</div>
    <div class="cdir" id="cw" onclick="go('w')" title="West">W</div>
    <div class="cdir blank"></div>
    <div class="cdir" id="ce" onclick="go('e')" title="East">E</div>
    <div class="cdir" id="cd" onclick="go('d')" title="Down">D</div>
    <div class="cdir" id="cs" onclick="go('s')" title="South">S</div>
    <div class="cdir blank"></div>
  </div>
</div>
</div>

<script>
// ── ROOMS ───────────────────────────────────────────────────────
// Each object: label, icon(opt), look, take(opt)=itemId or [id,id], open(bool), danger(bool)
const R1 = {
  gatehouse:{name:'The Gatehouse',style:'dungeon',
    desc:"You stand before the gates of Shadowgate. Cold wind howls through iron bars. Two torches bracket the entrance. Your own torch flickers. Everyone warned about this place ignored the warning. You are here anyway.",
    exits:{n:'entry_hall'},

      lantern:{label:'Lantern',icon:'🪔',look:"A brass lantern on the shelf. Still has oil. Burns slower than a torch.",take:'lantern'},

  entry_hall:{name:'Entry Hall',style:'hall',
    desc:"The Entry Hall is vast and cold. Empty suits of armor stand at attention along the walls. Passages lead in four directions. Something watches you. You decide it is the architecture.",

    desc:"Stone sarcophagi line the walls. Six of them. The sixth reads: HERE LIES HE WHO OPENED THE WRONG ONE. You appreciate the candor.",

      sarc_1:{label:'Sarcophagus I',look:"'Ser Aldric Graves. He tried.' Poignant.",open:true},

// ── STATE ─────────────────────────────────────────────────────
let G = {};
function rooms(){ return G.ep===2 ? R2 : R1; }

function newGame(){
  G = {
    ep:1, room:'gatehouse', inv:[], sel_item:null,
    active_verb:'look', sel_obj:null,
    torch:100, extra_torch:0, has_lantern:false,
    turns:0, dead:false, won:false,
    taken: new Set(),
    // ep1 flags
    chapel_prog:0, chapel_done:false,
    crypt_open:false, oracle_solved:false,
    dragon_dead:false, bridge_paid:false,
    mirror_used:false, chest_open:false,
    talimar_bound:false,
    ritual_timer:0, ritual_on:false,
    // ep2 flags
    river_crossed:false,
    mill_jammed:false, cabinet_open:false,
    fire_out:false, web_burned:false, spider_dead:false,
    raven_freed:false, snake_freed:false,
    malach_material:false, malach_bound:false,
  };
  document.getElementById('death-scr').classList.remove('show');
  document.getElementById('win-scr').classList.remove('show');
  document.getElementById('ep2-scr').classList.remove('show');
  document.getElementById('ritual').style.display='none';
  document.getElementById('h-ep').style.display='none';
  stoneCache={};
  music.stop(); music.play('dungeon');
  enterRoom('gatehouse');
}

// ── ROOM ENTER ────────────────────────────────────────────────
function enterRoom(id){
  G.room = id;
  G.turns++;
  G.sel_obj = null;
  const room = rooms()[id];
  if(!room){ log('ERROR: room not found: '+id,'bad'); return; }
  document.getElementById('rname').textContent = room.name.toUpperCase();
  log(room.desc);

  // Special on-enter events
  if(id==='oracle_chamber' && !G.oracle_solved) showRiddle();
  if(id==='warlock_chamber'){
    music.stop(); music.play('boss');
    log("⚑ BIND Talimar with the Spellbook — then immediately DESTROY him with the Crystal Vial.",'warn');
    startRitual(55);
  }
  if(id==='void_sanctum'){
    music.stop(); music.play('boss');
    log("⚑ Use VOID CRYSTAL on Malachar → BIND → ALCHEMY BOMB. In that order.",'warn');
    startRitual(65);
  }
  if(id==='dragons_lair' && !G.dragon_dead)
    log("⚠ The dragon opens one eye. It is evaluating you.",'warn');
  if(id==='void_antechamber' && G.raven_freed && !G.taken.has('void_antechamber_void_crystal'))
    log("The raven perches nearby. At its feet: something blue and humming.",'good');
  if(id==='the_pit')
    log("You survived the fall. The Spellbook is still in your coat. Everything else is gone.",'warn');

  buildObjects();
  updateCompass();
  updateInv();
}

// ── NAVIGATION ────────────────────────────────────────────────
function go(dir){
  if(G.dead||G.won) return;
  const room = rooms()[G.room];
  const ex = room.exits||{};
  if(!ex[dir]){ log("No passage that way."); return; }

  // Lock checks
  if(G.room==='crypt' && dir==='d'){
    if(!G.crypt_open){ log("⚫ The stone hatch is locked. It needs a skull-shaped key."); return; }
    if(!G.inv.includes('rope')){ log("⚫ The hatch opens — but the drop needs a rope."); return; }
  }
  if(G.room==='great_hall' && dir==='e' && !G.inv.includes('ancient_key')){
    log("⚫ A heavy door, secured with an ancient lock."); return;
  }
  if(G.room==='library' && dir==='e' && !G.mirror_used){
    log("⚫ The east wall looks solid. The silver mirror might reveal something."); return;
  }
  if(G.room==='sanctum' && dir==='n'){
    if(!G.taken.has('sanctum_gem_used')){ log("⚫ The north door has a violet gem-shaped socket. The Gem of Opening fits there."); return; }
  }
  if(G.room==='dragons_lair' && dir==='n' && !G.dragon_dead){
    log("⚫ The dragon blocks the northern passage. It is alive and watching you."); return;
  }
  if(G.room==='bridge' && dir==='n' && !G.bridge_paid){
    log("⚫ The troll blocks the north end. 'Three. Silver. Pieces.' He is not negotiating."); return;
  }
  if(G.room==='oracle_chamber' && dir==='n' && !G.oracle_solved){
    log("⚫ The Oracle blocks the passage. Answer her riddle first."); return;
  }
  if(G.room==='chapel' && dir==='e' && !G.chapel_done){
    log("⚫ A heavy iron door, locked. A skull-shaped keyhole."); return;
  }
  if(G.room==='flooded_passage' && dir==='n' && !(G.fire_out && G.taken.has('debris_cleared'))){
    log("⚫ Burning debris blocks the passage. Put out the fire first, then clear the stone."); return;
  }
  if(G.room==='spider_chamber' && dir==='e' && !G.spider_dead){
    log("⚫ The spider is alive and between you and the east passage."); return;
  }
  sfx('step');
  fadeGo(()=>enterRoom(ex[dir]));
}

// ── VERB + OBJECT SYSTEM ──────────────────────────────────────
document.querySelectorAll('.verb').forEach(b=>{
  b.onclick=()=>{
    G.active_verb=b.dataset.v;
    document.querySelectorAll('.verb').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(b.dataset.v!=='use') G.sel_item=null;
    updateInv();
  };
});

function buildObjects(){
  const list = document.getElementById('objlist');
  list.innerHTML='';
  const room = rooms()[G.room];
  if(!room) return;
  Object.entries(room.obj||{}).forEach(([key,obj])=>{
    if(obj.take && G.taken.has(G.room+'_'+key)) return;
    const el = document.createElement('div');
    el.className='obj';
    el.dataset.key=key;
    el.textContent=(obj.icon?obj.icon+' ':'')+obj.label;
    el.onclick=()=>execVerb(key, obj, el);
    list.appendChild(el);
  });
}

function execVerb(key, obj, el){
  if(G.dead||G.won) return;
  const verb = G.active_verb;

  // Highlight selected
  document.querySelectorAll('.obj').forEach(x=>x.classList.remove('sel'));
  if(el) el.classList.add('sel');
  G.sel_obj=key;

  if(verb==='look'){
    log('['+obj.label+'] '+obj.look);
    return;
  }
  if(verb==='take'){
    doTake(key, obj); return;
  }
  if(verb==='open'){
    doOpen(key, obj); return;
  }
  if(verb==='use'){
    doUse(key, obj); return;
  }
  if(verb==='cast'){
    if(!G.inv.includes('spellbook')){
      log("You don't have the Spellbook. You wave your hands. Nothing happens."); return;
    }
    document.getElementById('spell-m').style.display='block'; return;
  }
}

function doTake(key, obj){
  if(!obj.take){ log("You can't take that."); return; }
  if(G.taken.has(G.room+'_'+key)){ log("Already taken."); return; }
  G.taken.add(G.room+'_'+key);
  if(obj.take==='torch2'){
    G.extra_torch+=2;
    log("⚑ Two torches collected. ("+G.extra_torch+" spare)",'good');
  } else if(obj.take==='torch'){
    G.extra_torch+=1;
    log("⚑ Torch collected. ("+G.extra_torch+" spare)",'good');
  } else if(obj.take==='lantern'){
    G.has_lantern=true; G.inv.push('lantern');
    log("⚑ Lantern collected.",'good');
  } else {
    G.inv.push(obj.take);
    log("⚑ "+ITEMS[obj.take].name+" added to inventory.",'good');
  }
  sfx('pickup'); buildObjects(); updateInv();
}

function doOpen(key, obj){
  if(!obj.open){ log("You can't open that."); return; }
  const r=G.room;

  if(r==='crypt'){
    if(key==='hatch'){
      if(!G.inv.includes('skull_key')){ log("The skull-shaped lock won't yield."); return; }
      if(!G.inv.includes('rope')){ log("You unlock the hatch — but the drop needs a rope."); return; }
      log("You unlock the hatch with the Skull Key and lower the rope. Passage down is open.",'good');
      G.crypt_open=true; R1.crypt.exits.d='bone_passage'; sfx('unlock'); updateCompass(); return;
    }
    if(key==='sarc_2'||key==='sarc_bad'){
      die("A skeleton lunges. The Crypt now contains one more occupant than it did. You are it."); return;
    }
    if(key==='sarc_4'){ log("The sarcophagus slides open. The Ancient Key lies beside the bones. (Take it.)"); return; }
    log("The sarcophagus is empty. It smells like the past."); return;
  }
  if(r==='throne_room'&&key==='chest'){
    if(!G.inv.includes('ancient_key')){ log("The chest won't open. Old iron keyhole — familiar design."); return; }
    if(G.chest_open){ log("Open. Dragon's Bane is inside (already taken)."); return; }
    log("The Ancient Key fits. Inside: Dragon's Bane — an arrow tipped with void-iron.",'good');
    G.chest_open=true; G.inv.push('dragons_bane'); sfx('unlock'); updateInv(); return;
  }
  if(r==='sanctum'&&key==='socket_door'){
    if(!G.inv.includes('gem')){ log("The socket needs the Gem of Opening."); return; }
    log("The Gem pulses as you press it into the socket. The north door splits open silently.",'good');
    G.inv=G.inv.filter(i=>i!=='gem'); G.taken.add('sanctum_gem_used');
    R1.sanctum.exits.n='warlock_tower'; sfx('unlock'); updateCompass(); updateInv(); return;
  }
  if(r==='bone_mill'&&key==='cabinet'){
    if(!G.mill_jammed){ log("The cabinet is behind the running mechanism. Jam the mill first."); return; }
    if(!G.inv.includes('old_key')){ log("The cabinet is locked. The key on the hook would open it."); return; }
    if(G.cabinet_open){ log("Open. Already have the bomb components."); return; }
    log("The key opens the cabinet. Inside: sulfur crystals and an iron flask.",'good');
    G.cabinet_open=true; G.inv.push('bomb_parts'); sfx('unlock'); updateInv(); return;
  }
  log("Nothing to open here, or it's already open.");
}

function doUse(key, obj){
  const item = G.sel_item;
  const r = G.room;

  if(!item && !isAutoUse(r, key)){
    log("Select an item from your inventory first, then click the object to use it on.",'sys'); return;
  }

  // Chapel candles: no item needed (use torch/flame you carry)
  if(r==='chapel' && ['candle_l','candle_c','candle_r'].includes(key)){
    if(G.torch<=0 && G.extra_torch===0 && !G.has_lantern){ log("You have no flame to light the candle with."); return; }
    const seq=['candle_l','candle_c','candle_r'];
    const expected=seq[G.chapel_prog];
    if(key===expected){
      G.chapel_prog++;
      sfx('pickup');
      if(G.chapel_prog<3){ log("The candle lights. "+(3-G.chapel_prog)+" more."); }
      else {
        log("All three candles blaze. The altar grinds open — a skull-shaped key inside.",'good');
        G.chapel_done=true; G.inv.push('skull_key');
        R1.chapel.exits.e='crypt'; sfx('unlock');
        log("⚑ Skull Key added. East door is now open.",'good'); updateInv(); updateCompass();
      }
    } else {
      G.chapel_prog=0;
      log("Wrong order — the candles gutter out. Start over: first the failing, then the faithful, then the heart.",'warn');
    }
    return;
  }

  // Dragon: USE item
  if(r==='dragons_lair'&&key==='dragon'){
    if(item==='dragons_bane'){
      if(!G.inv.includes('sword')){ die("Dragon's Bane is an arrow. You have no bow. You throw it. The dragon is confused. Then you're on fire."); return; }
      log("You strike the weak joint with Dragon's Bane then drive the Iron Sword home. The dragon falls. The cavern goes silent.",'good');
      G.dragon_dead=true; G.inv=G.inv.filter(i=>i!=='dragons_bane'&&i!=='sword');
      R1.dragons_lair.exits.n='bridge'; sfx('victory');
      log("⚑ Northern passage is clear.",'good'); updateInv(); updateCompass(); return;
    }
    if(item==='sword'){ die("You charge the dragon with the Iron Sword. The dragon evaluates you. The evaluation is brief. You are on fire."); return; }
    log("That won't work on the dragon."); return;
  }

  // Troll: coins or mirror+2 coins
  if(r==='bridge'&&key==='troll'){
    const coins=G.inv.filter(i=>['coin1','coin2','coin3'].includes(i)).length;
    if(item==='mirror'&&coins>=2){
      log("You hold the mirror up. The troll sees himself. Long silence. 'I'm...' He steps aside. You used two coins.",'good');
      G.bridge_paid=true; G.inv=G.inv.filter(i=>i!=='coin1'&&i!=='coin2');
      R1.bridge.exits.n='sanctum_approach'; sfx('unlock'); updateCompass(); updateInv(); return;
    }
    if(['coin1','coin2','coin3'].includes(item)){
      if(coins>=3){
        log("You count out three coins. The troll takes them with enormous gravity and steps aside. Pinned to the wall: 'I used to be a knight.' You believe him.",'good');
        G.bridge_paid=true; G.inv=G.inv.filter(i=>!['coin1','coin2','coin3'].includes(i));
        R1.bridge.exits.n='sanctum_approach'; sfx('unlock'); updateCompass(); updateInv(); return;
      }
      log("You have "+coins+" coin"+(coins===1?'':'s')+". The troll needs three. He counts. Counts again. Shakes his head."); return;
    }
  }

  // Mirror in library
  if(r==='library'&&key==='mirror'&&item==='mirror'){
    log("You hold the mirror toward the east wall. The reflection shows a door. You turn — there it is, ajar. Hidden passage revealed.",'good');
    G.mirror_used=true; R1.library.exits.e='hidden_archives'; sfx('unlock'); updateCompass(); return;
  }

  // Warlock boss
  if(r==='warlock_chamber'){
    if(item==='spellbook'){ document.getElementById('spell-m').style.display='block'; return; }
    log("Using that on Talimar doesn't help right now."); return;
  }

  // ── EP2 ──
  // Swing across river with rope
  if(r==='underground_river'&&key==='stalactite'&&item==='rope2'){
    log("You tie the rope to the stalactite and swing across. Barely. On the far bank: an empty bucket.",'good');
    G.river_crossed=true;
    // make bucket takeable
    R2.underground_river.obj.far_bucket.take='bucket';
    sfx('step'); buildObjects(); return;
  }
  // Fill bucket at river (after crossing — USE bucket ON river)
  if(r==='underground_river'&&key==='river'&&item==='bucket'){
    log("You fill the bucket from the river. Heavy. Cold. Very wet.",'good');
    G.inv=G.inv.filter(i=>i!=='bucket'); G.inv.push('bucket_w');
    sfx('pickup'); updateInv(); return;
  }
  // Jam mill with gear
  if(r==='bone_mill'&&key==='mechanism'&&item==='gear'){
    log("You jam the gear into the mechanism. A grinding shriek. Silence. The mill stops. The cabinet is now accessible.",'good');
    G.mill_jammed=true; G.inv=G.inv.filter(i=>i!=='gear');
    sfx('unlock'); updateInv(); return;
  }
  // Use old_key on cabinet
  if(r==='bone_mill'&&key==='cabinet'&&item==='old_key'){
    doOpen('cabinet',obj); return;
  }
  // Water on fire
  if(r==='flooded_passage'&&key==='fire_debris'&&item==='bucket_w'){
    log("You hurl the bucket of river water onto the burning debris. The fire dies in a furious hiss. The stone debris remains — use something sharp to chip through it.",'good');
    G.fire_out=true; G.inv=G.inv.filter(i=>i!=='bucket_w'); G.inv.push('bucket');
    sfx('unlock'); updateInv(); buildObjects(); return;
  }
  if(r==='flooded_passage'&&key==='fire_debris'&&item==='crystal_shard'&&G.fire_out){
    log("The crystal shard chips through the debris. The passage north opens.",'good');
    G.taken.add('debris_cleared'); R2.flooded_passage.exits.n='spider_chamber';
    sfx('unlock'); updateCompass(); return;
  }
  if(r==='flooded_passage'&&key==='fire_debris'&&item==='bucket'&&!G.fire_out){
    die("You throw the empty bucket at the fire. The bucket doesn't contain water. The fire notes this and continues. You're close enough to catch. You do."); return;
  }
  // Burn web
  if(r==='spider_chamber'&&key==='web'&&item==='torch'){
    if(G.torch<10&&G.extra_torch===0){ die("You touch your guttering torch to the web. The flame barely exists. The web catches but so does your sleeve. The spider makes a decision about you."); return; }
    log("You touch the torch to the web. It burns fast. The spider drops from the ceiling, enraged. Time to fight.",'good');
    G.web_burned=true; sfx('pickup'); buildObjects(); return;
  }
  // Fight spider
  if(r==='spider_chamber'&&key==='spider'){
    if(!G.web_burned){ die("You approach the spider before burning the web. It cocoons you with the efficiency of something that has done this thousands of times."); return; }
    if(item==='crystal_shard'){
      log("The crystal shard is surgical. The fight is brief and unpleasant. The spider is dead. East passage is clear.",'good');
      G.spider_dead=true; R2.spider_chamber.exits.e='alchemy_lab';
      sfx('victory'); buildObjects(); updateCompass(); return;
    }
    log("You need something sharp to fight the spider. The crystal shard would work."); return;
  }
  // Build bomb in lab
  if(r==='alchemy_lab'&&key==='retort'&&item==='bomb_parts'){
    log("You combine the components in the retort. Three tense minutes. A blue flash. Result: an Alchemy Bomb, stable until it isn't.",'good');
    G.inv=G.inv.filter(i=>i!=='bomb_parts'); G.inv.push('alchemy_bomb');
    sfx('unlock'); updateInv(); return;
  }
  // Free raven
  if(r==='menagerie'&&key==='raven_cage'&&item==='old_key'){
    log("The key fits. The raven steps out, looks at you a long moment, then flies north through a crack. It took nothing. Ravens are mysterious.",'good');
    G.raven_freed=true; G.inv=G.inv.filter(i=>i!=='old_key');
    sfx('pickup'); updateInv(); return;
  }
  // Free snake
  if(r==='menagerie'&&key==='snake_cage'&&item==='crystal_shard'){
    log("The shard picks the lock. The snake slips out, disappears into a tunnel, returns — depositing a void crystal fragment at your feet. Then gone.",'good');
    G.snake_freed=true;
    // Add void crystal to void_antechamber if raven hasn't been there
    if(!G.raven_freed){ G.inv.push('void_crystal'); log("⚑ Void Crystal added to inventory.",'good'); }
    sfx('pickup'); updateInv(); return;
  }
  // Materialize Malachar
  if(r==='void_sanctum'&&key==='malachar'&&item==='void_crystal'){
    log("You hurl the void crystal at Malachar. It collapses. He solidifies with a sound like shattering glass. 'Oh,' he says. 'Clever.' He is material. He is not happy.",'good');
    G.malach_material=true; G.inv=G.inv.filter(i=>i!=='void_crystal');
    sfx('unlock'); updateInv(); return;
  }
  if(r==='void_sanctum'&&key==='malachar'&&item==='alchemy_bomb'&&G.malach_bound){
    log("You throw the Alchemy Bomb. It contacts Malachar — anchored by BIND, destroyed by the bomb. The explosion is contained and complete.",'good');
    setTimeout(()=>winGame2(), 1800); return;
  }
  if(r==='void_sanctum'&&key==='malachar'&&item==='alchemy_bomb'&&!G.malach_bound){
    die("You throw the Alchemy Bomb before binding Malachar. He sidesteps. The bomb lands behind you. Malachar says: 'oh, interesting.' Then he is alone."); return;
  }
  if(r==='void_sanctum'&&key==='malachar'&&!G.malach_material){
    die("You reach for Malachar without the Void Crystal. Your hand passes through him — then he grabs your arm with both hands and pulls. You learn, briefly, that there are more dimensions than three."); return;
  }
  if(r==='void_sanctum'&&key==='void_gate'&&item==='void_crystal'){
    log("Use the Void Crystal on Malachar himself, not the gate.",'sys'); return;
  }

  log("Using "+( item ? (ITEMS[item]?.name||item) : "that" )+" there doesn't accomplish anything right now.");
}

// ── SPELLS ───────────────────────────────────────────────────
function castSpell(sp){
  document.getElementById('spell-m').style.display='none';
  const r=G.room;
  if(r==='warlock_chamber'){
    if(sp==='SUMMON'){ die("You cast SUMMON. Something answers immediately. The Spellbook warned you specifically. You are gone before processing what it was."); return; }
    if(sp==='BIND'&&G.talimar_bound){ log("Already bound. DESTROY with the Crystal Vial — now.",'warn'); return; }
    if(sp==='BIND'){ log("BIND! Talimar's feet root to the floor. He strains. 'You—' It holds. DESTROY him with the Crystal Vial NOW.",'good'); G.talimar_bound=true; return; }
    if(sp==='DESTROY'&&!G.talimar_bound){ die("DESTROY without BIND first. Talimar absorbs it. 'Really?' He wasn't threatened by DESTROY. He was worried about BIND first. You've demonstrated you didn't know that."); return; }
    if(sp==='DESTROY'&&G.talimar_bound){
      if(!G.inv.includes('crystal_vial')){ log("DESTROY crackles — but no Crystal Vial anchor. It disperses. The binding weakens. You need the Vial.",'warn'); return; }
      log("You hurl the Crystal Vial and cast DESTROY. A flash of white void-light. Talimar screams in a language you don't know. The rift collapses.",'good');
      setTimeout(()=>winGame1(), 1800); return;
    }
    if(sp==='OPEN'){ log("OPEN crackles out. Nothing here responds."); return; }
  }
  if(r==='void_sanctum'){
    if(sp==='SUMMON'){ die("You cast SUMMON in the Void Sanctum. Even Malachar takes a step back. That is the last thing you observe."); return; }
    if(sp==='BIND'&&!G.malach_material){ die("BIND at an incorporeal entity. The spell passes through and binds a wall. Malachar watches with detached curiosity."); return; }
    if(sp==='BIND'&&G.malach_bound){ log("Already bound. Use the Alchemy Bomb.",'warn'); return; }
    if(sp==='BIND'&&G.malach_material){ log("BIND! Malachar's feet root to the void-stone. He wrenches at it. '...Not bad,' he admits. USE the Alchemy Bomb NOW.",'good'); G.malach_bound=true; return; }
    if(sp==='DESTROY'&&!G.malach_bound){ die("DESTROY without BIND. Malachar sidesteps. 'You were supposed to bind me first.' Then he is no longer interested in being disappointed."); return; }
  }
  // Generic
  if(sp==='SUMMON'){ die("You cast SUMMON. Something answers. It has been waiting. It is not what you expected. You are gone before you process what it was."); return; }
  if(sp==='OPEN') log("OPEN crackles. Nothing nearby unlocks itself.");
  else if(sp==='BIND') log("BIND thickens the air. Nothing here worth binding.");
  else if(sp==='DESTROY') log("DESTROY needs an anchor target. Without one it implodes back on itself. Mildly unpleasant.");
}

// ── TORCH ─────────────────────────────────────────────────────
function burnTorch(dt){
  if(G.dead||G.won) return;
  const rate=G.has_lantern?.08:.20;
  G.torch=Math.max(0, G.torch-rate*dt);
  if(G.torch<20&&G.torch>18) log("⚠ Your torch is dying. The darkness notices.",'warn');
  if(G.torch<=0){
    if(G.extra_torch>0){ G.extra_torch--; G.torch=100; log("Your torch dies. You light another."); }
    else die("Your torch goes out. In the absolute dark, something that was waiting for exactly this moment finds you.");
  }
  if(G.ritual_on&&G.ritual_timer>0){
    G.ritual_timer-=dt;
    const pct=Math.max(0,G.ritual_timer/(G.room==='warlock_chamber'?55:65));
    const fill=document.getElementById('ritual-fill');
    fill.style.width=(pct*100)+'%';
    fill.style.background=pct<.3?'#7A1515':pct<.6?'#8A4010':'#5A1010';
    if(G.ritual_timer<12&&G.ritual_timer>10) log("⚠ The ritual is nearly complete. DO IT NOW.",'bad');
    if(G.ritual_timer<=0){
      const msg=G.room==='warlock_chamber'
        ?"Talimar completes the ritual. The rift tears fully open. Whatever comes through is not interested in your continued existence."
        :"Malachar breaks the binding. The gate opens. The void answers. You are not invited.";
      die(msg);
    }
  }
  updateHUD();
}
function updateHUD(){
  document.getElementById('h-tpct').textContent=Math.ceil(G.torch)+'%';
  document.getElementById('h-tct').textContent=G.extra_torch;
  document.getElementById('h-turns').textContent=G.turns;
  document.getElementById('h-ticon').textContent=G.torch<20?'🕯️':G.torch<50?'🔦':'🔥';
}

// ── RENDERER ─────────────────────────────────────────────────
const cv=document.getElementById('cv');
const cc=cv.getContext('2d');
let W=0,H=0,stoneCache={},animF=0,lastT=0,tf=1,tfT=1;
let particles=[];

const RS={
  dungeon:{a:[40,28,10],s:[55,50,70],c:.36,d:.62,f:[25,20,12],fog:.4},
  crypt:  {a:[10,25,40],s:[40,50,65],c:.28,d:.55,f:[12,18,28],fog:.6},
  chapel: {a:[60,35,8], s:[70,60,55],c:.32,d:.60,f:[30,22,12],fog:.3},
  hall:   {a:[45,25,5], s:[60,55,72],c:.24,d:.70,f:[28,20,10],fog:.35},
  armory: {a:[30,20,8], s:[55,52,58],c:.30,d:.58,f:[22,18,10],fog:.4},
  dragon: {a:[80,30,5], s:[70,40,30],c:.35,d:.65,f:[40,15,5], fog:.5},
  bridge: {a:[20,15,35],s:[50,45,65],c:.40,d:.80,f:[0,0,5],   fog:.7},
  magic:  {a:[40,10,60],s:[50,30,80],c:.30,d:.65,f:[20,5,35], fog:.55},
  void_r: {a:[5,5,20],  s:[25,20,45],c:.20,d:.85,f:[0,0,12],  fog:.8},
  tower:  {a:[25,12,50],s:[45,35,70],c:.45,d:.70,f:[12,5,28], fog:.6},
  cave:   {a:[20,18,8], s:[52,48,42],c:.38,d:.60,f:[18,15,8], fog:.45},
  crystal:{a:[15,30,50],s:[60,80,100],c:.30,d:.58,f:[10,20,35],fog:.5},
  flooded:{a:[10,20,30],s:[45,55,60],c:.32,d:.65,f:[5,15,25], fog:.6},
};

function resize(){
  const wrap=document.getElementById('vwrap');
  W=cv.width=wrap.clientWidth; H=cv.height=wrap.clientHeight; stoneCache={};
}
window.addEventListener('resize',resize);

function getPat(rgb){
  const k=rgb.join(',');if(stoneCache[k])return stoneCache[k];
  const oc=document.createElement('canvas');oc.width=128;oc.height=64;
  const c=oc.getContext('2d');
  for(let row=0;row<5;row++){const off=(row%2)*20;for(let col=-1;col<4;col++){const v=.75+Math.random()*.25;c.fillStyle=`rgb(${rgb[0]*v|0},${rgb[1]*v|0},${rgb[2]*v|0})`;c.fillRect(col*40-off+1,row*18+1,38,16);}}
  c.fillStyle='rgba(0,0,0,.4)';for(let r=0;r<=5;r++)c.fillRect(0,r*18,128,1);
  const p=cc.createPattern(oc,'repeat');stoneCache[k]=p;return p;
}

function drawFrame(){
  if(!W||!G.room)return;
  const room=rooms()[G.room];if(!room)return;
  const st=RS[room.style]||RS.dungeon;
  const dep=st.d,ch=st.c;
  const vpx=W/2,vpy=H*.42;
  const fw={l:W*.3*dep+(1-dep)*0,r:W-(W*.3*dep),t:vpy-H*.26+H*ch*.3*dep,b:vpy+H*.27};

  cc.fillStyle='#000';cc.fillRect(0,0,W,H);

  // Ceiling
  const cg=cc.createLinearGradient(0,0,0,fw.t);
  const ai=[Math.min(255,st.a[0]*tf|0),Math.min(255,st.a[1]*tf*.9|0),Math.min(255,st.a[2]*tf*.7|0)];
  cg.addColorStop(0,`rgb(${ai[0]*.2|0},${ai[1]*.2|0},${ai[2]*.3|0})`);
  cg.addColorStop(1,`rgb(${ai[0]*.6|0},${ai[1]*.55|0},${ai[2]*.7|0})`);
  cc.fillStyle=cg;cc.beginPath();cc.moveTo(0,0);cc.lineTo(W,0);cc.lineTo(fw.r,fw.t);cc.lineTo(fw.l,fw.t);cc.closePath();cc.fill();

  // Floor
  const s=st.f;
  const fg=cc.createLinearGradient(0,fw.b,0,H);
  fg.addColorStop(0,`rgb(${s[0]+ai[0]*.4|0},${s[1]+ai[1]*.3|0},${s[2]+ai[2]*.2|0})`);
  fg.addColorStop(1,`rgb(${s[0]*.4|0},${s[1]*.4|0},${s[2]*.4|0})`);
  cc.fillStyle=fg;cc.beginPath();cc.moveTo(0,H);cc.lineTo(W,H);cc.lineTo(fw.r,fw.b);cc.lineTo(fw.l,fw.b);cc.closePath();cc.fill();

  // Side walls
  const pat=getPat(st.s);
  ['l','r'].forEach(side=>{
    cc.save();cc.beginPath();
    side==='l'?cc.moveTo(0,0):cc.moveTo(W,0);
    side==='l'?cc.lineTo(fw.l,fw.t):cc.lineTo(fw.r,fw.t);
    side==='l'?cc.lineTo(fw.l,fw.b):cc.lineTo(fw.r,fw.b);
    side==='l'?cc.lineTo(0,H):cc.lineTo(W,H);
    cc.closePath();cc.clip();cc.fillStyle=pat;cc.globalAlpha=.7;cc.fillRect(0,0,W,H);
    const sg=cc.createLinearGradient(side==='l'?0:W,0,side==='l'?fw.l:fw.r,0);
    sg.addColorStop(0,'rgba(0,0,0,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');
    cc.globalAlpha=1;cc.fillStyle=sg;cc.fillRect(0,0,W,H);cc.restore();
  });

  // Far wall
  cc.save();cc.beginPath();cc.rect(fw.l,fw.t,fw.r-fw.l,fw.b-fw.t);cc.clip();
  cc.fillStyle=pat;cc.globalAlpha=.9;cc.fillRect(fw.l,fw.t,fw.r-fw.l,fw.b-fw.t);
  cc.globalAlpha=1;
  const fc=cc.createRadialGradient(vpx,vpy,0,vpx,vpy,(fw.r-fw.l)*.8);
  fc.addColorStop(0,`rgba(${ai[0]},${ai[1]},${ai[2]},.2)`);fc.addColorStop(1,'rgba(0,0,0,.5)');
  cc.fillStyle=fc;cc.fillRect(fw.l,fw.t,fw.r-fw.l,fw.b-fw.t);cc.restore();

  // Exit arch indicators
  const ex=room.exits||{};
  if(ex.n||ex.u){
    const aw=(fw.r-fw.l)*.35,ah=(fw.b-fw.t)*.72;
    cc.fillStyle='rgba(0,0,5,.96)';cc.fillRect(vpx-aw/2,fw.t,aw,ah);
    cc.fillStyle='rgba(207,196,166,.18)';cc.font='8px Cinzel,serif';cc.textAlign='center';
    cc.fillText(ex.u?'▲ UP':'▲ N',vpx,fw.t+ah-6);
  }
  if(ex.w||ex.d){cc.fillStyle='rgba(0,0,0,.9)';cc.fillRect(0,H*.2,fw.l,H*.6);cc.fillStyle='rgba(207,196,166,.18)';cc.font='8px Cinzel,serif';cc.textAlign='left';cc.fillText(ex.d?'▼DN':'◄W',6,H*.5);}
  if(ex.e){cc.fillStyle='rgba(0,0,0,.9)';cc.fillRect(fw.r,H*.2,W-fw.r,H*.6);cc.fillStyle='rgba(207,196,166,.18)';cc.font='8px Cinzel,serif';cc.textAlign='right';cc.fillText('E►',W-6,H*.5);}
  if(ex.s){cc.fillStyle='rgba(207,196,166,.15)';cc.font='8px Cinzel,serif';cc.textAlign='center';cc.fillText('▼ S',W/2,H-6);}

  // Torch light
  const tx=vpx+Math.sin(animF*.04)*7,ty=fw.t-H*.07;
  const tg=cc.createRadialGradient(tx,ty,0,vpx,vpy,W*.72*tf);
  tg.addColorStop(0,`rgba(255,170,50,${.18*tf})`);tg.addColorStop(.35,`rgba(200,90,15,${.09*tf})`);tg.addColorStop(1,`rgba(0,0,0,${.5*(1.6-tf)})`);
  cc.fillStyle=tg;cc.fillRect(0,0,W,H);

  // Fog
  const fogA=(st.fog||.4)*(1-tf*.25);
  if(fogA>0){const fg2=cc.createRadialGradient(vpx,vpy,0,vpx,vpy,Math.min(W,H)*.6);fg2.addColorStop(0,'rgba(0,0,0,0)');fg2.addColorStop(1,`rgba(0,0,0,${fogA})`);cc.fillStyle=fg2;cc.fillRect(0,0,W,H);}

  // Low-torch red vignette
  if(G.torch<20){const rv=cc.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);rv.addColorStop(0,'rgba(0,0,0,0)');rv.addColorStop(1,`rgba(90,0,0,${(20-G.torch)/20*.5})`);cc.fillStyle=rv;cc.fillRect(0,0,W,H);}

  // Vignette
  const vg=cc.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.65)');
  cc.fillStyle=vg;cc.fillRect(0,0,W,H);

  // Torch flame
  const fs=(10+Math.sin(animF*.1)*3)*tf;
  cc.save();const fl=cc.createRadialGradient(tx,ty,0,tx,ty,fs*1.5);
  fl.addColorStop(0,'rgba(255,245,200,.95)');fl.addColorStop(.35,'rgba(255,150,35,.75)');fl.addColorStop(1,'rgba(180,20,0,0)');
  cc.fillStyle=fl;cc.beginPath();cc.arc(tx,ty,fs*1.5,0,Math.PI*2);cc.fill();cc.restore();

  // Particles
  if(animF%3===0&&G.torch>5) particles.push({x:tx+(Math.random()-.5)*5,y:ty,vx:(Math.random()-.5)*.7,vy:-(1.5+Math.random()*1.5),life:1,decay:.02,s:1.5+Math.random()*2});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0).slice(-80);
  particles.forEach(p=>{cc.save();cc.globalAlpha=p.life*.75;cc.fillStyle=`hsl(${25+(1-p.life)*20},88%,${48+p.life*28}%)`;cc.beginPath();cc.arc(p.x,p.y,p.s,0,Math.PI*2);cc.fill();cc.restore();});
}

const MEL_B=[[NN.A3,_e],[NN.R,_e],[NN.A3,_e],[NN.Bb3,_e],[NN.A3,_e],[NN.G3,_q],[NN.F3,_e],[NN.R,_e],[NN.F3,_e],[NN.G3,_e],[NN.F3,_e],[NN.E3,_q],[NN.D3,_e],[NN.E3,_e],[NN.F3,_e],[NN.G3,_e],[NN.A3,_q],[NN.R,_q],[NN.B3,_e],[NN.A3,_e],[NN.G3,_e],[NN.F3,_e],[NN.E3,_h],[NN.R,_h]];

class Chip{
  constructor(){this.on=false;this.ts=[];}
  _v(notes,type,vol){
    let i=0;const tick=()=>{
      if(!this.on)return;
      const[f,d]=notes[i];
      if(f>0){const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
        o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(vol*.01,ac.currentTime+d/1000*.88);
        o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d/1000);}
      i=(i+1)%notes.length;this.ts.push(setTimeout(tick,d));
    };tick();
  }
  play(t){this.stop();this.on=true;
    if(t==='dungeon'){this._v(MEL_D,'square',.055);this._v(BAS_D,'triangle',.038);}
    else if(t==='boss'){this._v(MEL_B,'square',.075);}
  }
  stop(){this.on=false;this.ts.forEach(clearTimeout);this.ts=[];}
}
const music=new Chip();

function sfx(t){
  try{const ac=getAC(),mg=ac.createGain(),ct=ac.currentTime;
    mg.gain.value=.2;mg.connect(ac.destination);
    if(t==='step'){const b=ac.createBuffer(1,2048,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<2048;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/2048,2)*.35;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=280;s.connect(f);f.connect(mg);s.start();}
    else if(t==='pickup'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(880,ct);o.frequency.exponentialRampToValueAtTime(1320,ct+.1);g.gain.setValueAtTime(.25,ct);g.gain.exponentialRampToValueAtTime(.001,ct+.22);o.connect(g);g.connect(mg);o.start();o.stop(ct+.22);}
    else if(t==='unlock'){[440,660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,ct+i*.1);g.gain.exponentialRampToValueAtTime(.001,ct+i*.1+.18);o.connect(g);g.connect(mg);o.start(ct+i*.1);o.stop(ct+i*.1+.18);});}
    else if(t==='death'){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,ct);o.frequency.exponentialRampToValueAtTime(55,ct+1.2);g.gain.setValueAtTime(.28,ct);g.gain.exponentialRampToValueAtTime(.001,ct+1.4);o.connect(g);g.connect(mg);o.start();o.stop(ct+1.4);}
    else if(t==='victory'){[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.13,ct+i*.12);g.gain.exponentialRampToValueAtTime(.001,ct+i*.12+.55);o.connect(g);g.connect(mg);o.start(ct+i*.12);o.stop(ct+i*.12+.55);});}
  }catch(e){}
}

function log(text,cls){
  const w=document.getElementById('log'),p=document.createElement('p');
  if(cls)p.className=cls;p.textContent=text;w.appendChild(p);
  while(w.children.length>80)w.removeChild(w.firstChild);
  w.scrollTop=w.scrollHeight;
}
function fadeGo(cb){
  const o=document.createElement('div');
  o.style.cssText='position:absolute;inset:0;background:#000;opacity:0;transition:opacity .28s;z-index:9;pointer-events:none;';
  document.getElementById('vwrap').appendChild(o);
  requestAnimationFrame(()=>o.style.opacity='1');
  setTimeout(()=>{cb();o.style.opacity='0';setTimeout(()=>o.remove(),300);},300);
}

// ── MAIN LOOP ─────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;animF++;
  if(!G.dead&&!G.won){
    tfT=.86+Math.sin(animF*.07)*.07+Math.sin(animF*.13)*.04;
    tf+=(tfT-tf)*.08;tf*=(.62+G.torch/100*.38);tf=Math.max(.28,Math.min(1,tf));
    burnTorch(dt);
  }
  drawFrame();
}
