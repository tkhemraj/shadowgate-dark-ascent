<title>Shadowgate: The Dark Ascent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@1&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#03030E;--panel:#08081A;--stone:#0E0E1C;--amber:#D97A08;--blood:#7A1515;--parch:#C8BC9A;--dim:#5A5460;--border:#252038;--hi:#F0A030;--good:#A07820}
html,body{width:100%;height:100%;background:var(--bg);color:var(--parch);font-family:'Cinzel',serif;overflow:hidden;user-select:none}
#shell{display:grid;grid-template-columns:1fr 190px;grid-template-rows:34px 1fr auto auto 44px;width:100%;height:100vh;max-width:1100px;margin:0 auto}
#bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#gtitle{font-family:'Cinzel Decorative',serif;font-size:.88rem;letter-spacing:.14em;color:var(--amber);text-shadow:0 0 20px rgba(217,122,8,.55)}
#hud{display:flex;gap:18px;font-size:.63rem;letter-spacing:.07em}
.hstat{display:flex;align-items:center;gap:5px;color:var(--dim)}
.hval{color:var(--parch);font-weight:600;min-width:1.8ch;text-align:right}
#vwrap{position:relative;background:#000;overflow:hidden;border-right:1px solid var(--border)}
#cv{display:block;width:100%;height:100%}
#rname{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.2em;font-weight:600;color:rgba(200,188,154,.75);text-shadow:0 0 12px rgba(217,122,8,.5);pointer-events:none;white-space:nowrap}
#ritual{position:absolute;top:0;left:0;right:0;height:4px;display:none;background:rgba(0,0,0,.4)}
#ritual-fill{height:4px;background:var(--blood);width:100%}
#sidebar{background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--border)}
#inv-hdr{padding:6px 10px;font-size:.58rem;letter-spacing:.18em;color:var(--dim);border-bottom:1px solid var(--border);text-transform:uppercase}
#inv{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;overflow-y:auto;align-content:start}
.islot{aspect-ratio:1;background:var(--stone);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:border-color .15s,box-shadow .15s;padding:3px}
.islot:hover{border-color:rgba(217,122,8,.5)}
.islot.sel{border-color:var(--amber);background:#14092A;box-shadow:0 0 8px rgba(217,122,8,.25) inset}
.iico{font-size:1.2rem;line-height:1}
.ilbl{font-size:.43rem;letter-spacing:.04em;color:var(--dim);text-align:center;line-height:1.2}
#objwrap{grid-column:1/-1;background:var(--stone);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 12px;min-height:52px}
#objtitle{font-size:.56rem;letter-spacing:.16em;color:var(--dim);margin-bottom:4px;text-transform:uppercase}
#objlist{display:flex;flex-wrap:wrap;gap:5px}
.obj{padding:4px 11px;background:var(--panel);border:1px solid var(--border);font-size:.67rem;letter-spacing:.08em;cursor:pointer;transition:border-color .12s,color .12s}
.obj:hover,.obj.sel{border-color:var(--amber);color:var(--amber)}
#log{grid-column:1/-1;background:#040410;padding:7px 14px;overflow-y:auto;font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;line-height:1.65;color:var(--parch);height:115px}
#log p{margin:0;padding:1px 0}
#log p.sys{color:var(--dim);font-style:normal;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.07em}
#log p.bad{color:#902020}#log p.good{color:var(--good)}#log p.warn{color:#804010}
#log::-webkit-scrollbar{width:3px}#log::-webkit-scrollbar-thumb{background:var(--border)}
#bottom{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 9px;background:var(--panel);border-top:1px solid var(--border)}
.verb{padding:4px 11px;background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.1em;cursor:pointer;transition:all .14s;height:30px}
.verb:hover,.verb.active{border-color:var(--amber);color:var(--amber);background:rgba(217,122,8,.07);box-shadow:0 0 8px rgba(217,122,8,.12)}
#verb-sep{flex:1}
#compass{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,20px);gap:2px;margin-right:4px}
.cdir{background:transparent;border:1px solid var(--border);color:var(--dim);font-family:'Cinzel',serif;font-size:.58rem;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.cdir:hover{border-color:var(--amber);color:var(--amber);background:rgba(217,122,8,.08)}
.cdir.live{border-color:#243060;color:#4468B0}
.cdir.blank{visibility:hidden}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .8s;z-index:20}
.overlay.show{opacity:1;pointer-events:all}
#death-scr{background:rgba(0,0,0,.94)}
#death-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.9rem;color:#880000;text-shadow:0 0 32px rgba(136,0,0,.9),0 0 80px rgba(136,0,0,.4);letter-spacing:.16em}
#death-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.87rem;color:var(--dim);max-width:460px;text-align:center;line-height:1.9}
#win-scr{background:rgba(0,0,0,.95)}
#win-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--amber);text-shadow:0 0 40px rgba(217,122,8,.9);letter-spacing:.12em}
#win-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.84rem;color:var(--parch);max-width:500px;text-align:center;line-height:1.9;white-space:pre-line}
#ep2-scr{background:rgba(0,0,0,.98)}
#ep2-scr h2{font-family:'Cinzel Decorative',serif;font-size:1.4rem;color:#660000;letter-spacing:.14em;text-shadow:0 0 28px rgba(120,0,0,.8)}
#ep2-scr p{font-family:'IM Fell English',serif;font-style:italic;font-size:.86rem;color:var(--dim);max-width:400px;text-align:center;line-height:1.85}
.rbtn{padding:7px 24px;background:transparent;border:1px solid currentColor;font-family:'Cinzel',serif;font-size:.69rem;letter-spacing:.13em;cursor:pointer;transition:all .22s}
.rbtn.blood{color:#882020}.rbtn.blood:hover{background:#880000;color:#fff;box-shadow:0 0 20px rgba(136,0,0,.5)}
.rbtn.amber{color:var(--amber)}.rbtn.amber:hover{background:var(--amber);color:#000;box-shadow:0 0 20px rgba(217,122,8,.5)}
#spell-m{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#07071C;border:1px solid #2E2840;padding:14px 20px;z-index:30;min-width:170px;display:none;box-shadow:0 0 40px rgba(0,0,0,.8)}
.spell-opt{padding:7px 12px;font-size:.68rem;letter-spacing:.1em;cursor:pointer;color:var(--parch);transition:background .12s,color .12s}
.spell-opt:hover{background:rgba(217,122,8,.1);color:var(--amber)}
#riddle-m{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#06061C;border:1px solid #2E2840;padding:18px 22px;z-index:30;min-width:300px;box-shadow:0 0 60px rgba(0,0,0,.9)}
</style>

<div id="shell">
<div id="bar">
  <div id="gtitle">Shadowgate: The Dark Ascent</div>
  <div id="hud">
    <div class="hstat"><span id="h-ticon">🔥</span>&nbsp;TORCH&nbsp;<span class="hval" id="h-tpct">100%</span></div>
    <div class="hstat">SPARE&nbsp;<span class="hval" id="h-tct">0</span></div>
    <div class="hstat">TURNS&nbsp;<span class="hval" id="h-turns">0</span></div>
    <div class="hstat" id="h-ep" style="display:none">EP&nbsp;<span class="hval" id="h-epn">I</span></div>
  </div>
</div>
<div id="vwrap">
  <canvas id="cv"></canvas>
  <div id="rname"></div>
  <div id="ritual"><div id="ritual-fill"></div></div>
  <div class="overlay" id="death-scr">
    <h2>YOU HAVE DIED</h2>
    <p id="death-msg"></p>
    <button class="rbtn blood" onclick="startGame()">TRY AGAIN</button>
  </div>
  <div class="overlay" id="win-scr">
    <h2>VICTORY</h2>
    <p id="win-msg"></p>
    <button class="rbtn amber" onclick="startGame()">PLAY AGAIN</button>
  </div>
  <div class="overlay" id="ep2-scr">
    <h2>SHADOWGATE II</h2>
    <p>The floor gives way. You fall.<br><br>Below Shadowgate, something older has been waiting.</p>
  </div>
  <div id="spell-m">
    <div style="color:var(--amber);font-size:.63rem;letter-spacing:.16em;margin-bottom:10px;border-bottom:1px solid #2E2840;padding-bottom:6px">CAST SPELL</div>
    <div class="spell-opt" onclick="castSpell('OPEN')">OPEN</div>
    <div class="spell-opt" onclick="castSpell('BIND')">BIND</div>
    <div class="spell-opt" onclick="castSpell('SUMMON')">SUMMON</div>
    <div class="spell-opt" onclick="castSpell('DESTROY')">DESTROY</div>
    <div class="spell-opt" style="color:var(--dim);margin-top:4px;border-top:1px solid #1A1828;padding-top:4px" onclick="closeSpell()">cancel</div>
  </div>
</div>
<div id="sidebar">
  <div id="inv-hdr">Inventory</div>
  <div id="inv"></div>
</div>
<div id="objwrap">
  <div id="objtitle">Objects in room</div>
  <div id="objlist"></div>
</div>
<div id="log"></div>
<div id="bottom">
  <button class="verb active" data-v="look">LOOK</button>
  <button class="verb" data-v="take">TAKE</button>
  <button class="verb" data-v="use">USE</button>
  <button class="verb" data-v="open">OPEN</button>
  <button class="verb" data-v="cast">CAST</button>
  <div id="verb-sep"></div>
  <div id="compass">
    <div class="cdir blank"></div>
    <div class="cdir" id="cn" onclick="go('n')">N</div>
    <div class="cdir" id="cu" onclick="go('u')">U</div>
    <div class="cdir" id="cw" onclick="go('w')">W</div>
    <div class="cdir blank"></div>
    <div class="cdir" id="ce" onclick="go('e')">E</div>
    <div class="cdir" id="cd" onclick="go('d')">D</div>
    <div class="cdir" id="cs" onclick="go('s')">S</div>
    <div class="cdir blank"></div>
  </div>
</div>
</div>

<script>
// ── GAME DATA ────────────────────────────────────────────────
const R1={
  gatehouse:{name:'The Gatehouse',style:'dungeon',
    desc:"You stand before the gates of Shadowgate. Cold wind howls through iron bars. Two torches bracket the entrance. Your own torch flickers. Everyone warned about this place. You came anyway.",
    exits:{n:'entry_hall'},
    obj:{
      gate:{label:'Iron Gate',look:"Bears a crest: two serpents devouring a star. It's open. That's not reassuring."},
      crow:{label:'Crow',icon:'🐦‍⬛',look:"The crow watches with professional interest. It does not speak. Crows can't. You are aware. You are very stressed."},
      torches:{label:'Wall Torches',icon:'🕯️',look:"Iron brackets hold two fresh torches. Someone left them recently.",take:'torch2'},
      lantern:{label:'Lantern',icon:'🪔',look:"A brass lantern on the shelf. Still has oil. Burns slower than a torch.",take:'lantern'},
    }},
  entry_hall:{name:'Entry Hall',style:'hall',
    desc:"The Entry Hall is vast and cold. Empty suits of armor stand at attention. Passages lead in four directions. Something watches you. You decide it is the architecture.",
    exits:{n:'great_hall',e:'chapel',w:'armory',s:'gatehouse'},
    obj:{
      armor:{label:'Suit of Armor',look:"Full plate, empty. You check twice. The helmet is slightly tilted. You are imagining this. You walk faster."},
      tapestry:{label:'Tapestry',look:"A tapestry depicts a knight slaying a dragon. The dragon looks smug. There are no art historians here to debate this."},
      shield:{label:'Iron Shield',icon:'🛡️',look:"A battered iron shield leaning against the wall. Still serviceable.",take:'shield'},
      rope:{label:'Rope',icon:'🪢',look:"Coiled rope on the floor. Long. Useful.",take:'rope'},
    }},
  chapel:{name:'The Chapel',style:'chapel',
    desc:"The chapel smells of cold wax and old prayer. Three candlesticks on the altar, unlit. An inscription reads: 'First the failing, then the faithful, then the heart.'",
    exits:{w:'entry_hall'},
    obj:{
      candle_l:{label:'Left Candle (failing)',icon:'🕯️',look:"The leftmost candlestick. The inscription calls this one 'the failing.'"},
      candle_c:{label:'Center Candle (faithful)',icon:'🕯️',look:"The center candlestick. 'The faithful.'"},
      candle_r:{label:'Right Candle (heart)',icon:'🕯️',look:"The rightmost. 'The heart.'"},
      altar:{label:'Altar',look:"Stone altar. Three candlesticks. Inscription: 'Light the path: First the failing, then the faithful, then the heart.' A sealed compartment below."},
      prayer_book:{label:'Prayer Book',icon:'📕',look:"A devotional text on a pew. Extremely concerned prayers.",take:'prayer_book'},
      coin:{label:'Strange Coin',icon:'🪙',look:"A coin on the offering plate. One side: a bridge. The other: void.",take:'coin1'},
    }},
  crypt:{name:'The Crypt',style:'crypt',
    desc:"Stone sarcophagi line the walls. Six of them. The sixth reads: HERE LIES HE WHO OPENED THE WRONG ONE. You appreciate the candor.",
    exits:{w:'chapel'},
    obj:{
      sarc_1:{label:'Sarcophagus I',look:"'Ser Aldric Graves. He tried.' Poignant.",open:true},
      sarc_2:{label:'Sarcophagus II',look:"'Lady Mourne. She was very thorough.' The lid is cracked from the inside.",open:true,danger:true},
      sarc_3:{label:'Sarcophagus III',look:"'The Unknown Adventurer. Unknown for several reasons.'",open:true},
      sarc_4:{label:'Sarcophagus IV (Kelwick)',icon:'🔑',look:"'Kelwick of Hammerfall. He found the key.' A small Ancient Key lies beside the sarcophagus.",take:'ancient_key',open:true},
      sarc_5:{label:'Sarcophagus V',look:"'Brother Orin. He prayed first. It didn't help, but it was kind.'",open:true},
      sarc_bad:{label:'Marked Sarcophagus',look:"'HERE LIES HE WHO OPENED THE WRONG ONE.' Something shifts inside.",open:true,danger:true},
      hatch:{label:'Stone Hatch',look:"A hatch in the floor with a skull-shaped lock. Below: darkness and a rope's worth of drop.",open:true},
    }},
  armory:{name:'The Armory',style:'armory',
    desc:"Weapon racks line the walls. Most are empty. A dead forge in the corner. Someone scratched 'NICE TRY' above it.",
    exits:{e:'entry_hall'},
    obj:{
      forge:{label:'Dead Forge',look:"Cold for years. 'NICE TRY.' Someone found this funny. You do not."},
      sword:{label:'Iron Sword',icon:'⚔️',look:"A serviceable iron blade. Well-maintained. Someone expected it to be needed.",take:'sword'},
      hammer:{label:'Hammer',icon:'🔨',look:"Heavy iron hammer.",take:'hammer'},
    }},
  great_hall:{name:'The Great Hall',style:'hall',
    desc:"A vast dining hall set for a feast that never happened. A rat sits at the head of the table. It seems to be waiting.",

    obj:{
      table:{label:'Feast Table',look:"Petrified food. Cobwebbed cutlery. The rat makes eye contact. You look away first."},
      rat:{label:'Rat',icon:'🐀',look:"The rat stares. You stare. The rat has superior composure."},
      coin2:{label:'Strange Coin',icon:'🪙',look:"A coin placed deliberately on the table.",take:'coin2'},
    }},
  throne_room:{name:'The Throne Room',style:'dungeon',
    desc:"The throne is carved from obsidian. The velvet cushion is now mostly skeleton. A crystal vial sits on the armrest. A locked iron chest on the floor.",
    exits:{w:'great_hall'},
    obj:{
      throne:{label:'Obsidian Throne',look:"Radiates cold. The skeleton wore armor once. Dedication."},
      vial:{label:'Crystal Vial',icon:'🧪',look:"The liquid inside moves on its own. Sealed.",take:'crystal_vial'},
      chest:{label:'Locked Iron Chest',look:"Heavy iron chest. The keyhole is old — same design as a specific key.",open:true},
      banner:{label:'Black Banner',look:"A silver serpent eating itself. The Warlock Lord's crest."},
    }},
  bone_passage:{name:'The Bone Passage',style:'crypt',

    obj:{
      walls:{label:'Bone Walls',look:"Mostly human. Some not. All carefully arranged. Someone took time. That might be the most disturbing part."},
    }},
  oracle_chamber:{name:"Oracle's Chamber",style:'magic',
    desc:"A circular chamber. A still pool reflects nothing. A figure in grey robes sits beyond the pool. She is not surprised to see you.",
    exits:{s:'bone_passage'},

      stone:{label:"Oracle's Stone",icon:'🔮',look:"A smooth obsidian stone inscribed with an eye.",take:'oracle_stone'},
    }},
  serpent_hall:{name:'The Serpent Hall',style:'dungeon',

    }},
  library:{name:'The Library',style:'dungeon',
    desc:"Towering shelves, floor to ceiling. Most books are decayed. A silver mirror hangs on the east wall. A stone tablet on the reading table.",

      tablet:{label:'Stone Tablet',icon:'📜',look:"'The bridge demands three silver pieces — one per life ended in error. The toll-keeper is counting.'",take:'stone_tablet'},
      books:{label:'Ancient Books',look:"Three readable spines: 'Castle Architecture for Beginners.' 'Advanced Castle Architecture.' 'You Should Have Left When You Had the Chance.'"},
    }},
  hidden_archives:{name:'Hidden Archives',style:'crypt',
    desc:"A secret room. One candle burning somehow. Classified documents. A box on the central table.",
    exits:{w:'library'},

      coin3:{label:'Strange Coin',icon:'🪙',look:"A third coin, placed deliberately.",take:'coin3'},
      gem:{label:'Gem of Opening',icon:'💎',look:"A deep violet gem on a velvet cushion. It hums faintly.",take:'gem'},
    }},
  dragons_pass:{name:"Dragon's Pass",style:'dragon',
    desc:"The corridor is scorched black. Still warm. Something large passed recently. Sulfur in the air. Breathing from the east.",
    exits:{w:'serpent_hall',e:'dragons_lair'},
    obj:{
      scorch:{label:'Scorchmarks',look:"Warm under your hand. The footprints ahead are human-sized. The ones behind them are not."},
    }},
  dragons_lair:{name:"Dragon's Lair",style:'dragon',
    desc:"A vast cavern. Ceiling lost in sulfurous haze. Something enormous coiled around a cairn of bones. One eye opens. Amber. Old fire.",
    exits:{w:'dragons_pass'},
    obj:{
      dragon:{label:'The Dragon',look:"Ancient. Enormous. Watching you with the disdain of something that has outlived civilizations. It's evaluating you."},
      cairn:{label:'Bone Cairn',look:"Hundreds of years of failed attempts. You are not going to be on this pile."},
    }},
  bridge:{name:'Bridge of Skulls',style:'bridge',
    desc:"A narrow stone bridge over infinite void. The void breathes. At the midpoint: a troll. Enormous. Patient. Apparently employed.",
    exits:{s:'dragons_lair'},
    obj:{
      troll:{label:'The Troll',look:"Stone-skin. Professional stubbornness. He says: 'Three. Silver. Pieces.' He is not negotiating."},

    desc:"A long corridor of glowing runes. They pulse expectantly. A heavy iron door north.",
    exits:{s:'bridge',n:'sanctum'},
    obj:{
      runes:{label:'Glowing Runes',look:"Translation: 'Beyond this point, the Warlock Lord hears all.' Second rune: 'No refunds.'"},

    }},

    desc:"Spiral stairs ascend through crackling blue lightning. The climb is dangerous.",

      talimar:{label:'Talimar the Warlock Lord',look:"'You actually made it. I'm mildly impressed.' ⚑ BIND him with the Spellbook — then DESTROY with the Crystal Vial."},

const R2={
  the_pit:{name:'The Pit',style:'cave',

    obj:{
      walls:{label:'Stone Walls',look:"Natural rock. The hole above is gone — the earth closed. You are not going back that way."},
      pit_torch:{label:'Wall Torch',icon:'🕯️',look:"A wall-mounted torch, burning somehow.",take:'torch'},

    }},
  crystal_cavern:{name:'Crystal Cavern',style:'crystal',

    exits:{s:'the_pit',n:'bone_mill',e:'underground_river'},
    obj:{
      formations:{label:'Crystal Formations',look:"Breathtaking. Also extremely sharp."},
      crystal_shard:{label:'Crystal Shard',icon:'💠',look:"A fist-sized piece, broken clean. One edge is surgical.",take:'crystal_shard'},
    }},
  underground_river:{name:'Underground River',style:'flooded',
    desc:"Fast black water carves through rock. A bucket on the far shore. The rope in your inventory would reach the stalactite overhead.",
    exits:{w:'crystal_cavern'},

const D1=["The castle digests you slowly. Your remains are categorized and filed.","A skeleton picks up your torch and uses it to read. It is reading a love story.","You have become a cautionary tale. The castle has many.","The Spellbook's warning was, in retrospect, quite clear.","Somewhere, a new suit of armor appears in the Entry Hall. It fits.","The rat in the Great Hall looks unsurprised."];

let G={};
function rooms(){return G.ep===2?R2:R1;}

function newGame(){
  G={ep:1,room:'gatehouse',inv:[],sel_item:null,active_verb:'look',sel_obj:null,
    torch:100,extra_torch:0,has_lantern:false,turns:0,dead:false,won:false,
    taken:new Set(),chapel_prog:0,chapel_done:false,crypt_open:false,
    oracle_solved:false,dragon_dead:false,bridge_paid:false,mirror_used:false,
    chest_open:false,talimar_bound:false,ritual_timer:0,ritual_on:false,
    river_crossed:false,mill_jammed:false,cabinet_open:false,fire_out:false,
    web_burned:false,spider_dead:false,raven_freed:false,snake_freed:false,
    malach_material:false,malach_bound:false};
  ['death-scr','win-scr','ep2-scr'].forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById('ritual').style.display='none';
  document.getElementById('h-ep').style.display='none';
  texCache={};particles=[];
  music.stop();music.play('dungeon');
  enterRoom('gatehouse');
}

function enterRoom(id){
  G.room=id;G.turns++;G.sel_obj=null;
  const room=rooms()[id];if(!room){log('Unknown room: '+id,'bad');return;}
  document.getElementById('rname').textContent=room.name.toUpperCase();
  log(room.desc);
  if(id==='oracle_chamber'&&!G.oracle_solved)setTimeout(showRiddle,400);
  if(id==='warlock_chamber'){music.stop();music.play('boss');log("⚑ BIND Talimar with the Spellbook — then DESTROY with the Crystal Vial.",'warn');startRitual(55);}
  if(id==='void_sanctum'){music.stop();music.play('boss');log("⚑ VOID CRYSTAL on Malachar → BIND → ALCHEMY BOMB. In that order.",'warn');startRitual(65);}
  if(id==='dragons_lair'&&!G.dragon_dead)log("⚠ The dragon opens one eye. Old fire.",'warn');
  if(id==='the_pit')log("Your Spellbook survived the fall. Everything else is gone.",'warn');
  buildObjects();updateCompass();updateInv();
}

function go(dir){
  if(G.dead||G.won)return;
  const ex=rooms()[G.room]?.exits||{};
  if(!ex[dir]){log("No passage that way.");return;}
  if(G.room==='crypt'&&dir==='d'){if(!G.crypt_open){log("⚫ The stone hatch is locked. Needs a skull-shaped key.");return;}if(!G.inv.includes('rope')){log("⚫ The hatch opens — but the drop needs a rope.");return;}}
  if(G.room==='great_hall'&&dir==='e'&&!G.inv.includes('ancient_key')){log("⚫ A heavy door, secured with an ancient lock.");return;}
  if(G.room==='library'&&dir==='e'&&!G.mirror_used){log("⚫ The east wall looks solid. The silver mirror might reveal something.");return;}
  if(G.room==='sanctum'&&dir==='n'&&!G.taken.has('sanctum_gem_used')){log("⚫ The north door has a violet gem socket. The Gem of Opening fits there.");return;}
  if(G.room==='dragons_lair'&&dir==='n'&&!G.dragon_dead){log("⚫ The dragon blocks the northern passage.");return;}
  if(G.room==='bridge'&&dir==='n'&&!G.bridge_paid){log("⚫ The troll blocks the north end. 'Three. Silver. Pieces.'");return;}
  if(G.room==='oracle_chamber'&&dir==='n'&&!G.oracle_solved){log("⚫ The Oracle blocks the passage. Answer her riddle first.");return;}
  if(G.room==='chapel'&&dir==='e'&&!G.chapel_done){log("⚫ A heavy iron door, locked. A skull-shaped keyhole.");return;}
  if(G.room==='flooded_passage'&&dir==='n'&&!(G.fire_out&&G.taken.has('debris_cleared'))){log("⚫ Burning debris blocks the passage.");return;}
  if(G.room==='spider_chamber'&&dir==='e'&&!G.spider_dead){log("⚫ The spider is alive and between you and the east passage.");return;}
  sfx('step');fadeGo(()=>enterRoom(ex[dir]));
}

document.querySelectorAll('.verb').forEach(b=>{
  b.onclick=()=>{G.active_verb=b.dataset.v;document.querySelectorAll('.verb').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.v!=='use')G.sel_item=null;updateInv();};
});

function buildObjects(){
  const list=document.getElementById('objlist');list.innerHTML='';
  const room=rooms()[G.room];if(!room)return;
  Object.entries(room.obj||{}).forEach(([key,obj])=>{
    if(obj.take&&G.taken.has(G.room+'_'+key))return;
    const el=document.createElement('div');el.className='obj';el.dataset.key=key;
    el.textContent=(obj.icon?obj.icon+' ':'')+obj.label;
    el.onclick=()=>execVerb(key,obj,el);list.appendChild(el);
  });
}

function execVerb(key,obj,el){
  if(G.dead||G.won)return;
  document.querySelectorAll('.obj').forEach(x=>x.classList.remove('sel'));
  if(el)el.classList.add('sel');G.sel_obj=key;
  const v=G.active_verb;
  if(v==='look'){log('['+obj.label+'] '+obj.look);return;}
  if(v==='take'){doTake(key,obj);return;}
  if(v==='open'){doOpen(key,obj);return;}
  if(v==='use'){doUse(key,obj);return;}
  if(v==='cast'){if(!G.inv.includes('spellbook')){log("You don't have the Spellbook.");return;}document.getElementById('spell-m').style.display='block';return;}
}

function doTake(key,obj){
  if(!obj.take){log("You can't take that.");return;}
  if(G.taken.has(G.room+'_'+key)){log("Already taken.");return;}
  G.taken.add(G.room+'_'+key);
  if(obj.take==='torch2'){G.extra_torch+=2;log("⚑ Two torches collected. ("+G.extra_torch+" spare)",'good');}
  else if(obj.take==='torch'){G.extra_torch+=1;log("⚑ Torch collected. ("+G.extra_torch+" spare)",'good');}
  else if(obj.take==='lantern'){G.has_lantern=true;G.inv.push('lantern');log("⚑ Lantern collected.",'good');}
  else{G.inv.push(obj.take);log("⚑ "+(ITEMS[obj.take]?.name||obj.take)+" added to inventory.",'good');}
  sfx('pickup');buildObjects();updateInv();
}

function doOpen(key,obj){
  if(!obj.open){log("You can't open that.");return;}
  const r=G.room;
  if(r==='crypt'){
    if(key==='hatch'){if(!G.inv.includes('skull_key')){log("The skull-shaped lock won't yield.");return;}if(!G.inv.includes('rope')){log("Unlocked — but the drop needs a rope.");return;}log("You unlock the hatch and lower the rope. Passage down is open.",'good');G.crypt_open=true;R1.crypt.exits.d='bone_passage';sfx('unlock');updateCompass();return;}
    if(key==='sarc_2'||key==='sarc_bad'){die("A skeleton lunges. The Crypt now contains one more occupant than it did.");return;}
    if(key==='sarc_4'){log("The sarcophagus slides open. The Ancient Key lies beside the bones. (Take it.)");return;}
    log("The sarcophagus is empty.");return;
  }
  if(r==='throne_room'&&key==='chest'){if(!G.inv.includes('ancient_key')){log("Old iron keyhole — familiar design.");return;}if(G.chest_open){log("Open. Dragon's Bane inside (already taken).");return;}log("The Ancient Key fits. Inside: Dragon's Bane — void-iron arrow.",'good');G.chest_open=true;G.inv.push('dragons_bane');sfx('unlock');updateInv();return;}
  if(r==='sanctum'&&key==='socket_door'){if(!G.inv.includes('gem')){log("The socket needs the Gem of Opening.");return;}log("The Gem pulses as you press it in. The north door opens silently.",'good');G.inv=G.inv.filter(i=>i!=='gem');G.taken.add('sanctum_gem_used');R1.sanctum.exits.n='warlock_tower';sfx('unlock');updateCompass();updateInv();return;}
  if(r==='bone_mill'&&key==='cabinet'){if(!G.mill_jammed){log("Behind the running mechanism. Jam the mill first.");return;}if(!G.inv.includes('old_key')){log("Locked. The rusted key on the hook would open it.");return;}if(G.cabinet_open){log("Open. Already have the bomb components.");return;}log("The key opens it. Inside: sulfur crystals and an iron flask.",'good');G.cabinet_open=true;G.inv.push('bomb_parts');sfx('unlock');updateInv();return;}
  log("Nothing to open here, or it's already open.");
}

function doUse(key,obj){
  const item=G.sel_item,r=G.room;
  const autoUse=(r==='chapel'&&['candle_l','candle_c','candle_r'].includes(key));
  if(!item&&!autoUse){log("Select an item from your inventory first, then click the target object.",'sys');return;}

    const seq=['candle_l','candle_c','candle_r'],expected=seq[G.chapel_prog];

    else{G.chapel_prog=0;log("Wrong order — the candles gutter out. Start over: failing, faithful, heart.",'warn');}
    return;
  }
  if(r==='dragons_lair'&&key==='dragon'){
    if(item==='dragons_bane'){if(!G.inv.includes('sword')){die("Dragon's Bane is an arrow. No bow. You throw it. The dragon is confused. Then you're on fire.");return;}log("You strike the weak joint with Dragon's Bane then drive the Iron Sword home. The dragon falls.",'good');G.dragon_dead=true;G.inv=G.inv.filter(i=>i!=='dragons_bane'&&i!=='sword');R1.dragons_lair.exits.n='bridge';sfx('victory');log("⚑ Northern passage clear.",'good');updateInv();updateCompass();return;}
    if(item==='sword'){die("You charge the dragon with just the sword. The dragon evaluates you. The evaluation is brief. You are on fire.");return;}
    log("That won't work on the dragon.");return;
  }
  if(r==='bridge'&&key==='troll'){
    const coins=G.inv.filter(i=>['coin1','coin2','coin3'].includes(i)).length;
    if(item==='mirror'&&coins>=2){log("You hold the mirror up. The troll sees himself. Long silence. 'I'm...' He steps aside.",'good');G.bridge_paid=true;G.inv=G.inv.filter(i=>i!=='coin1'&&i!=='coin2');R1.bridge.exits.n='sanctum_approach';sfx('unlock');updateCompass();updateInv();return;}
    if(['coin1','coin2','coin3'].includes(item)){if(coins>=3){log("You count out three coins. The troll takes them with gravity and steps aside.",'good');G.bridge_paid=true;G.inv=G.inv.filter(i=>!['coin1','coin2','coin3'].includes(i));R1.bridge.exits.n='sanctum_approach';sfx('unlock');updateCompass();updateInv();return;}log("You have "+coins+" coin"+(coins===1?'':'s')+". The troll needs three.");return;}
  }
  if(r==='library'&&key==='mirror'&&item==='mirror'){log("You hold the mirror toward the east wall. The reflection shows a door. You turn — there it is, ajar.",'good');G.mirror_used=true;R1.library.exits.e='hidden_archives';sfx('unlock');updateCompass();return;}
  if(r==='warlock_chamber'){if(item==='spellbook'){document.getElementById('spell-m').style.display='block';return;}log("That won't help right now.");return;}
  // EP2
  if(r==='underground_river'&&key==='stalactite'&&item==='rope2'){log("You tie the rope to the stalactite and swing across. Barely. On the far bank: an empty bucket.",'good');G.river_crossed=true;R2.underground_river.obj.far_bucket.take='bucket';sfx('step');buildObjects();return;}
  if(r==='underground_river'&&key==='river'&&item==='bucket'){log("You fill the bucket from the river. Heavy. Cold. Very wet.",'good');G.inv=G.inv.filter(i=>i!=='bucket');G.inv.push('bucket_w');sfx('pickup');updateInv();return;}
  if(r==='bone_mill'&&key==='mechanism'&&item==='gear'){log("You jam the gear in. A grinding shriek. Silence. The mill stops. Cabinet accessible.",'good');G.mill_jammed=true;G.inv=G.inv.filter(i=>i!=='gear');sfx('unlock');updateInv();return;}
  if(r==='bone_mill'&&key==='cabinet'&&item==='old_key'){doOpen('cabinet',obj);return;}
  if(r==='flooded_passage'&&key==='fire_debris'&&item==='bucket_w'){log("You hurl the river water onto the burning debris. The fire dies in a furious hiss. Clear the stone now.",'good');G.fire_out=true;G.inv=G.inv.filter(i=>i!=='bucket_w');G.inv.push('bucket');sfx('unlock');updateInv();buildObjects();return;}

  if(r==='flooded_passage'&&key==='fire_debris'&&item==='bucket'&&!G.fire_out){die("You throw the empty bucket at the fire. The bucket doesn't contain water. You catch fire. The bucket notes this. Ironically.");return;}
  if(r==='spider_chamber'&&key==='web'&&item==='torch'){if(G.torch<10&&G.extra_torch===0){die("Your guttering torch touches the web. The web catches. So does your sleeve. The spider makes a decision.");return;}log("You touch the torch to the web. It burns fast. The spider drops from the ceiling, enraged.",'good');G.web_burned=true;sfx('pickup');buildObjects();return;}

function castSpell(sp){
  document.getElementById('spell-m').style.display='none';
  const r=G.room;
  if(r==='warlock_chamber'){
    if(sp==='SUMMON'){die("You cast SUMMON. Something answers immediately. You are gone before processing what it was.");return;}
    if(sp==='BIND'&&G.talimar_bound){log("Already bound. DESTROY with the Crystal Vial — now.",'warn');return;}
    if(sp==='BIND'){log("BIND! Talimar's feet root to the floor. 'You—' It holds. Use the Crystal Vial NOW.",'good');G.talimar_bound=true;return;}
    if(sp==='DESTROY'&&!G.talimar_bound){die("DESTROY without BIND first. Talimar absorbs it. 'Really?' He was worried about BIND. You didn't know that.");return;}
    if(sp==='DESTROY'&&G.talimar_bound){if(!G.inv.includes('crystal_vial')){log("DESTROY crackles — but no Crystal Vial anchor. Get the Vial.",'warn');return;}log("You hurl the Crystal Vial and cast DESTROY. White void-light. Talimar screams in a language you don't know. The rift collapses.",'good');setTimeout(()=>winGame1(),1800);return;}
    if(sp==='OPEN')log("OPEN crackles. Nothing here responds.");return;
  }
  if(r==='void_sanctum'){
    if(sp==='SUMMON'){die("You cast SUMMON in the Void Sanctum. Even Malachar takes a step back. That is the last thing you observe.");return;}
    if(sp==='BIND'&&!G.malach_material){die("BIND at an incorporeal entity. The spell passes through and binds a wall.");return;}
    if(sp==='BIND'&&G.malach_bound){log("Already bound. Use the Alchemy Bomb.",'warn');return;}
    if(sp==='BIND'&&G.malach_material){log("BIND! Malachar's feet root to the void-stone. '...Not bad.' USE the Alchemy Bomb NOW.",'good');G.malach_bound=true;return;}
    if(sp==='DESTROY'&&!G.malach_bound){die("DESTROY without BIND. Malachar sidesteps. 'You were supposed to bind me first.'");return;}return;
  }
  if(sp==='SUMMON'){die("You cast SUMMON. Something answers. It has been waiting. You are gone before processing what it was.");return;}
  if(sp==='OPEN')log("OPEN crackles. Nothing nearby unlocks itself.");
  else if(sp==='BIND')log("BIND thickens the air. Nothing here worth binding.");
  else if(sp==='DESTROY')log("DESTROY needs an anchor target. Without one it implodes back on itself. Mildly unpleasant.");
}

function buildStoneTex(rgb, variation, cacheKey){
  if(texCache[cacheKey]) return texCache[cacheKey];
  const TW=256, TH=256;
  const oc=document.createElement('canvas');oc.width=TW;oc.height=TH;
  const c=oc.getContext('2d');
  // Base pixel noise
  const id=c.createImageData(TW,TH);const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*variation;
    d[i]=Math.max(0,Math.min(255,rgb[0]+n));
    d[i+1]=Math.max(0,Math.min(255,rgb[1]+n*.9));
    d[i+2]=Math.max(0,Math.min(255,rgb[2]+n*.8));
    d[i+3]=255;
  }
  c.putImageData(id,0,0);
  // Stone blocks
  let y=0,row=0;
  while(y<TH){
    const bh=22+Math.floor(Math.random()*10);
    const off=(row%2)*30;let x=-off;
    while(x<TW){
      const bw=44+Math.floor(Math.random()*20);
      c.fillStyle='rgba(0,0,0,.44)';c.fillRect(x,y,bw+2,2);c.fillRect(x,y,2,bh+2);
      c.fillStyle='rgba(255,255,255,.065)';c.fillRect(x+2,y+2,bw-3,1);c.fillRect(x+2,y+2,1,bh-3);
      c.fillStyle='rgba(0,0,0,.14)';c.fillRect(x+2,y+bh,bw,2);c.fillRect(x+bw,y+2,2,bh);
      x+=bw+2;
    }
    y+=bh+2;row++;
  }
  // Cracks
  for(let i=0;i<4;i++){
    if(Math.random()>.55){
      c.strokeStyle=`rgba(0,0,0,${.2+Math.random()*.3})`;c.lineWidth=.5;c.beginPath();
      let cx=Math.random()*TW,cy=Math.random()*TH;c.moveTo(cx,cy);
      for(let j=0;j<6;j++){cx+=(Math.random()-.5)*14;cy+=Math.random()*12;c.lineTo(cx,cy);}
      c.stroke();
    }
  }
  const pat=cc.createPattern(oc,'repeat');texCache[cacheKey]=pat;return pat;
}

  cc.fillStyle=g;cc.beginPath();cc.moveTo(0,0);cc.lineTo(W,0);cc.lineTo(FW.r,FW.t);cc.lineTo(FW.l,FW.t);cc.closePath();cc.fill();

function drawFloor(st){
  const g=cc.createLinearGradient(0,FW.b,0,H);
  const [r,gr,b]=st.flr;
  g.addColorStop(0,`rgb(${Math.min(255,r+25)},${Math.min(255,gr+20)},${Math.min(255,b+10)})`);
  g.addColorStop(1,`rgb(${r>>1},${gr>>1},${b>>1})`);
  cc.fillStyle=g;cc.beginPath();cc.moveTo(0,H);cc.lineTo(W,H);cc.lineTo(FW.r,FW.b);cc.lineTo(FW.l,FW.b);cc.closePath();cc.fill();
  // Perspective floor lines
  cc.strokeStyle='rgba(0,0,0,.25)';cc.lineWidth=.5;
  for(let i=1;i<8;i++){
    const t=i/8;const y=lerp(FW.b,H,t);
    const xl=lerp(FW.l,0,t),xr=lerp(FW.r,W,t);
    cc.beginPath();cc.moveTo(xl,y);cc.lineTo(xr,y);cc.stroke();
  }
  for(let i=-2;i<=2;i++){
    cc.beginPath();cc.moveTo(VP.x+i*(W/5),FW.b);cc.lineTo(VP.x+i*(W/2.2),H);cc.stroke();
  }
}

    }
    // Step suggestion
    const sx2=cx-20,sw2=40;
    for(let i=0;i<4;i++){cc.fillStyle=`rgba(30,20,50,${.6-i*.1})`;cc.fillRect(sx2+i*5,FW.b-i*10-10,sw2-i*10,8);}
  }
  if(style==='armory'){
    // Crossed weapons on far wall
    drawWeapons(cx,ft+fh*.4,fh*.3);
  }
  cc.restore();
}

function drawArch(style,fl,ft,fw,fh){
  const aw=fw*.55,ah=fh*.9;
  const ax=FL+fw/2-aw/2,ay=ft,FL=fl;
  // Doorway void
  cc.fillStyle='rgba(0,0,3,.96)';
  if(style==='chapel'||style==='hall'){
    // Pointed gothic arch
    cc.beginPath();cc.moveTo(FL+fw*.5-aw/2,ft+fh);cc.lineTo(FL+fw*.5-aw/2,ft+fh*.3);
    cc.quadraticCurveTo(FL+fw*.5-aw/2,ft+fh*.05,FL+fw*.5,ft);
    cc.quadraticCurveTo(FL+fw*.5+aw/2,ft+fh*.05,FL+fw*.5+aw/2,ft+fh*.3);
    cc.lineTo(FL+fw*.5+aw/2,ft+fh);cc.closePath();cc.fill();
    // Arch stones
    cc.strokeStyle='rgba(90,80,100,.6)';cc.lineWidth=3;cc.beginPath();
    cc.moveTo(FL+fw*.5-aw/2,ft+fh*.3);cc.quadraticCurveTo(FL+fw*.5-aw/2,ft+fh*.05,FL+fw*.5,ft);
    cc.quadraticCurveTo(FL+fw*.5+aw/2,ft+fh*.05,FL+fw*.5+aw/2,ft+fh*.3);cc.stroke();
  } else {
    // Round arch
    const rw=aw*.5,rh=fh*.85;
    cc.beginPath();cc.moveTo(FL+fw*.5-rw,ft+fh);cc.lineTo(FL+fw*.5-rw,ft+fh-rh+rw);
    cc.arc(FL+fw*.5,ft+fh-rh+rw,rw,Math.PI,0);
    cc.lineTo(FL+fw*.5+rw,ft+fh);cc.closePath();cc.fill();
    cc.strokeStyle='rgba(90,80,100,.5)';cc.lineWidth=2.5;cc.beginPath();
    cc.moveTo(FL+fw*.5-rw,ft+fh-rh+rw);cc.arc(FL+fw*.5,ft+fh-rh+rw,rw,Math.PI,0);cc.stroke();
  }
}

function drawSkull(x,y,r){
  cc.fillStyle='rgba(180,165,140,.35)';
  cc.beginPath();cc.ellipse(x,y-r*.3,r,r*.85,0,0,Math.PI*2);cc.fill();
  cc.fillStyle='rgba(0,0,0,.7)';
  cc.beginPath();cc.ellipse(x-r*.28,y-r*.3,r*.2,r*.18,0,0,Math.PI*2);cc.fill();
  cc.beginPath();cc.ellipse(x+r*.28,y-r*.3,r*.2,r*.18,0,0,Math.PI*2);cc.fill();
  cc.fillStyle='rgba(180,165,140,.25)';
  cc.beginPath();cc.moveTo(x-r*.35,y+r*.4);cc.lineTo(x+r*.35,y+r*.4);cc.lineTo(x+r*.3,y+r*.9);cc.lineTo(x-r*.3,y+r*.9);cc.closePath();cc.fill();
}

function drawCrystals(x,y,count,light){
  for(let i=0;i<count;i++){
    const h=12+i*4,w=4+i,a=(i/count-.5)*1.2;
    const bx=x+(i-count/2)*8;
    cc.fillStyle=`rgba(${light.join(',')},${.3+.15*Math.sin(animF*.02+i)})`;
    cc.beginPath();cc.moveTo(bx,y);cc.lineTo(bx-w,y-h*.6);cc.lineTo(bx,y-h);cc.lineTo(bx+w,y-h*.6);cc.closePath();cc.fill();
    cc.strokeStyle=`rgba(${light.join(',')},${.5+.2*Math.sin(animF*.02+i)})`;cc.lineWidth=.5;cc.stroke();
  }
}

function drawWeapons(cx,cy,size){
  cc.strokeStyle='rgba(140,130,110,.45)';cc.lineWidth=3;cc.lineCap='round';
  cc.save();cc.translate(cx,cy);
  // Sword 1 (diagonal)
  cc.save();cc.rotate(.6);cc.beginPath();cc.moveTo(0,-size*.5);cc.lineTo(0,size*.5);cc.stroke();cc.beginPath();cc.moveTo(-size*.12,size*.38);cc.lineTo(size*.12,size*.38);cc.stroke();cc.restore();
  // Sword 2
  cc.save();cc.rotate(-.6);cc.beginPath();cc.moveTo(0,-size*.5);cc.lineTo(0,size*.5);cc.stroke();cc.beginPath();cc.moveTo(-size*.12,size*.38);cc.lineTo(size*.12,size*.38);cc.stroke();cc.restore();
  cc.restore();
}

function drawLighting(st){
  const tf2=Math.max(.3,tf);
  // Torch position: upper center of near view, slightly right
  const tx=VP.x+12+Math.sin(animF*.045)*8+Math.sin(animF*.077)*3;
  const ty=FW.t*.5+Math.sin(animF*.03)*5;
  // Outer warm glow (additive-style via screen blend)
  cc.save();cc.globalCompositeOperation='screen';
  const og=cc.createRadialGradient(tx,ty,0,VP.x,VP.y*1.1,W*.8*tf2);
  const [lr,lg,lb]=st.light;
  og.addColorStop(0,`rgba(${lr},${lg},${lb},${.15*tf2})`);
  og.addColorStop(.25,`rgba(${lr*.8|0},${lg*.7|0},${lb*.4|0},${.08*tf2})`);
  og.addColorStop(.7,`rgba(${lr*.3|0},${lg*.15|0},0,${.03*tf2})`);
  og.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=og;cc.fillRect(0,0,W,H);cc.restore();
  // Ambient room tint
  cc.save();cc.globalCompositeOperation='screen';
  const ag=cc.createRadialGradient(VP.x,VP.y,0,VP.x,VP.y,W*.6);
  const [ar,agr,ab]=st.amb;
  ag.addColorStop(0,`rgba(${ar},${agr},${ab},.06)`);ag.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=ag;cc.fillRect(0,0,W,H);cc.restore();
}

function drawAtmosphere(st){
  // Depth fog over the arch/far-wall area
  const fogA=st.fog*(1-tf*.2);
  if(fogA>0){
    const [fr,fg2,fb]=st.fogClr||[0,0,0];
    const fog=cc.createRadialGradient(VP.x,VP.y,0,VP.x,VP.y,Math.min(W,H)*.65);
    fog.addColorStop(0,'rgba(0,0,0,0)');fog.addColorStop(1,`rgba(${fr},${fg2},${fb},${fogA})`);
    cc.fillStyle=fog;cc.fillRect(0,0,W,H);
  }
  // Dust motes (on screen mode)
  if(animF%5===0&&G.torch>10) particles.push({x:VP.x+(Math.random()-.5)*W*.6,y:VP.y+(Math.random()-.5)*H*.4,life:.5,decay:.004,s:1.5,clr:'rgba(255,200,120,',vx:(Math.random()-.5)*.3,vy:-Math.random()*.4});
  // Low torch: red pulse
  if(G.torch<20){
    const pulse=(1-(G.torch/20))*.4*(.5+.5*Math.sin(animF*.08));
    const rv=cc.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
    rv.addColorStop(0,'rgba(0,0,0,0)');rv.addColorStop(.7,`rgba(80,0,0,${pulse})`);rv.addColorStop(1,`rgba(120,0,0,${pulse*1.4})`);
    cc.fillStyle=rv;cc.fillRect(0,0,W,H);
  }
}

function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    cc.save();cc.globalAlpha=p.life;cc.fillStyle=p.clr+p.life+')';
    cc.beginPath();cc.arc(p.x,p.y,p.s,0,Math.PI*2);cc.fill();cc.restore();
  });
  particles=particles.slice(-120);
}

function drawTorchFlame(){
  if(G.torch<=0)return;
  const tx=W*.62+Math.sin(animF*.05)*6+Math.sin(animF*.09)*3;
  const ty=H*.26+Math.sin(animF*.04)*4;
  const fs=(11+Math.sin(animF*.11)*4+Math.sin(animF*.07)*2)*tf;
  // Outer glow
  const og=cc.createRadialGradient(tx,ty,0,tx,ty,fs*2.8);
  og.addColorStop(0,'rgba(255,160,30,.18)');og.addColorStop(.5,'rgba(200,80,10,.08)');og.addColorStop(1,'rgba(0,0,0,0)');
  cc.fillStyle=og;cc.beginPath();cc.arc(tx,ty,fs*2.8,0,Math.PI*2);cc.fill();
  // Inner bright
  const ig=cc.createRadialGradient(tx,ty,0,tx,ty,fs);
  ig.addColorStop(0,'rgba(255,248,200,1)');ig.addColorStop(.3,'rgba(255,160,30,.95)');ig.addColorStop(.7,'rgba(220,60,5,.6)');ig.addColorStop(1,'rgba(150,20,0,0)');
  cc.fillStyle=ig;cc.beginPath();cc.arc(tx,ty,fs,0,Math.PI*2);cc.fill();
  // Flame tongues
  cc.fillStyle='rgba(255,210,80,.7)';
  for(let t=0;t<3;t++){
    const ox=(t-1)*fs*.35,f=animF*.08+t;
    cc.beginPath();
    cc.moveTo(tx+ox,ty+fs*.3);
    cc.quadraticCurveTo(tx+ox+Math.sin(f)*fs*.5,ty-fs*.6,tx+ox+Math.sin(f*1.4)*fs*.25,ty-fs*1.2);
    cc.quadraticCurveTo(tx+ox+Math.sin(f*.6)*fs*.3,ty-fs*.5,tx+ox,ty+fs*.3);
    cc.fill();
  }
  // Torch sparks
  if(animF%2===0&&G.torch>5){
    particles.push({x:tx+(Math.random()-.5)*fs,y:ty-fs*.5,vx:(Math.random()-.5)*1.2,vy:-(1.5+Math.random()*2),life:1,decay:.025+Math.random()*.02,s:1.2+Math.random(),clr:`hsl(${30+Math.random()*20},90%,${55+Math.random()*25}%,`.replace(',','%,')+'rgba('.replace('rgba(','')});
    // Fix spark color
    particles[particles.length-1].clr=`rgba(${255},${180+Math.floor(Math.random()*60)},${20+Math.floor(Math.random()*40)},`;
  }
}

function drawVignette(){
  const v=cc.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');
  cc.fillStyle=v;cc.fillRect(0,0,W,H);
  // Subtle noise grain
  if(animF%3===0){
    const gd=cc.createImageData(W,H);const ga=gd.data;
    for(let i=0;i<ga.length;i+=4){
      const g=(Math.random()<.04)?(Math.random()>.5?6:0):0;
      ga[i]=ga[i+1]=ga[i+2]=g;ga[i+3]=g?20:0;
    }
    cc.putImageData(gd,0,0);
  }
}

function drawExitHints(){
  const ex=rooms()[G.room]?.exits||{};
  cc.font='7px Cinzel,serif';cc.textAlign='center';cc.fillStyle='rgba(200,188,154,.22)';
  if(ex.n||ex.u){cc.fillText(ex.u?'▲UP':'▲N',VP.x,FW.t+12);}
  if(ex.s){cc.fillText('▼S',VP.x,FW.b-6);}
  if(ex.w||ex.d){cc.textAlign='left';cc.fillText(ex.d?'DN▼':'W◄',FW.l+8,VP.y);}
  if(ex.e){cc.textAlign='right';cc.fillText('►E',FW.r-8,VP.y);}
}

function drawFrame(){
  if(!W||!G.room)return;
  const room=rooms()[G.room];if(!room)return;
  const st=ST[room.style]||ST.dungeon;
  cc.fillStyle='#000';cc.fillRect(0,0,W,H);
  drawCeiling(st);
  drawFloor(st);
  drawSideWalls(st);
  drawFarWall(st);
  drawDecor(G.room,st);
  drawExitHints();
  drawLighting(st);
  drawAtmosphere(st);
  drawParticles();
  drawTorchFlame();
  drawVignette();
}

// ── CHIPTUNE ─────────────────────────────────────────────────
let aCtx=null;
function getAC(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx;}
const NN={A2:110,B2:123,C3:131,D3:147,E3:165,F3:175,G3:196,A3:220,B3:247,Bb3:233,C4:262,D4:294,E4:330,F4:349,G4:392,R:0};
const Q=420,Hd=840,Wd=1680,E=210;
const MEL=[[NN.E4,Q],[NN.D4,E],[NN.C4,E],[NN.B3,Q],[NN.A3,Hd],[NN.R,E],[NN.C4,Q],[NN.D4,E],[NN.E4,E],[NN.F4,Q],[NN.E4,Hd],[NN.R,E],[NN.G3,Q],[NN.A3,E],[NN.B3,E],[NN.C4,Q],[NN.D4,Hd],[NN.R,E],[NN.B3,Q],[NN.A3,Q],[NN.G3,Q],[NN.A3,Hd+Q],[NN.R,Q],[NN.A3,E],[NN.G3,E],[NN.F3,E],[NN.E3,E],[NN.D3,Q],[NN.E3,Hd],[NN.F3,Q],[NN.G3,E],[NN.A3,E],[NN.B3,Q],[NN.A3,Hd],[NN.G3,Q],[NN.F3,Q],[NN.E3,Q],[NN.A3,Wd]];
const BAS=[[NN.A2,Hd],[NN.R,Q],[NN.E3,Q],[NN.A2,Hd],[NN.R,Q],[NN.G3,Q],[NN.C3,Hd],[NN.R,Q],[NN.G3,Q],[NN.A2,Hd],[NN.R,Q],[NN.A2,Q],[NN.F3,Hd],[NN.R,Q],[NN.E3,Q],[NN.G3,Hd],[NN.R,Q],[NN.D3,Q],[NN.A2,Wd+Hd]];
const BOSS=[[NN.A3,E],[NN.R,E],[NN.A3,E],[NN.Bb3,E],[NN.A3,E],[NN.G3,Q],[NN.F3,E],[NN.R,E],[NN.F3,E],[NN.G3,E],[NN.F3,E],[NN.E3,Q],[NN.D3,E],[NN.E3,E],[NN.F3,E],[NN.G3,E],[NN.A3,Q],[NN.R,Q],[NN.B3,E],[NN.A3,E],[NN.G3,E],[NN.F3,E],[NN.E3,Hd],[NN.R,Hd]];
class Chip{constructor(){this.on=false;this.ts=[];}
  _v(notes,type,vol){let i=0;const tick=()=>{if(!this.on)return;const[f,d]=notes[i];if(f>0){const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(vol*.01,ac.currentTime+d/1000*.85);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d/1000);}i=(i+1)%notes.length;this.ts.push(setTimeout(tick,d));};tick();}
  play(t){this.stop();this.on=true;if(t==='dungeon'){this._v(MEL,'square',.052);this._v(BAS,'triangle',.035);}else if(t==='boss'){this._v(BOSS,'square',.072);}}
  stop(){this.on=false;this.ts.forEach(clearTimeout);this.ts=[];}
}
const music=new Chip();

function sfx(t){try{const ac=getAC(),mg=ac.createGain(),ct=ac.currentTime;mg.gain.value=.18;mg.connect(ac.destination);
  if(t==='step'){const b=ac.createBuffer(1,2048,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<2048;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/2048,2)*.3;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=260;s.connect(f);f.connect(mg);s.start();}
  else if(t==='pickup'){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(880,ct);o.frequency.exponentialRampToValueAtTime(1320,ct+.1);g.gain.setValueAtTime(.22,ct);g.gain.exponentialRampToValueAtTime(.001,ct+.2);o.connect(g);g.connect(mg);o.start();o.stop(ct+.2);}
  else if(t==='unlock'){[440,660,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.16,ct+i*.1);g.gain.exponentialRampToValueAtTime(.001,ct+i*.1+.16);o.connect(g);g.connect(mg);o.start(ct+i*.1);o.stop(ct+i*.1+.16);});}
  else if(t==='death'){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,ct);o.frequency.exponentialRampToValueAtTime(55,ct+1.2);g.gain.setValueAtTime(.25,ct);g.gain.exponentialRampToValueAtTime(.001,ct+1.4);o.connect(g);g.connect(mg);o.start();o.stop(ct+1.4);}
  else if(t==='victory'){[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,ct+i*.12);g.gain.exponentialRampToValueAtTime(.001,ct+i*.12+.5);o.connect(g);g.connect(mg);o.start(ct+i*.12);o.stop(ct+i*.12+.5);});}
}catch(e){}}

// ── MAIN LOOP ─────────────────────────────────────────────────
function burnTorch(dt){
  if(G.dead||G.won)return;
  const rate=G.has_lantern?.07:.18;
  G.torch=Math.max(0,G.torch-rate*dt);
  if(G.torch<20&&G.torch>18.5)log("⚠ Your torch is dying. The darkness notices.",'warn');
  if(G.torch<=0){if(G.extra_torch>0){G.extra_torch--;G.torch=100;log("Your torch dies. You light another.");}else die("Your torch goes out. In the absolute dark, something that was waiting for exactly this moment finds you.");}
  if(G.ritual_on&&G.ritual_timer>0){
    G.ritual_timer-=dt;
    const max=G.room==='warlock_chamber'?55:65;
    const pct=Math.max(0,G.ritual_timer/max);
    const fill=document.getElementById('ritual-fill');
    fill.style.width=(pct*100)+'%';
    fill.style.background=pct<.3?'#8A0000':pct<.6?'#8A4010':'#6A1010';
    if(G.ritual_timer<12&&G.ritual_timer>10.5)log("⚠ The ritual is nearly complete. DO IT NOW.",'bad');
    if(G.ritual_timer<=0){die(G.room==='warlock_chamber'?"Talimar completes the ritual. The rift tears open. Whatever comes through is not interested in your continued existence.":"Malachar breaks the binding. The gate opens. The void answers. You are not invited.");}
  }
  updateHUD();
}

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;animF++;
  if(!G.dead&&!G.won){
    // Torch flicker: sum of oscillators
    const target=.84+Math.sin(animF*.06)*.07+Math.sin(animF*.11)*.05+Math.sin(animF*.17)*.03;
    tfV+=(target-tf)*.12;tf+=tfV;tfV*=.7;
    tf*=(.6+G.torch/100*.4);tf=Math.max(.25,Math.min(1.05,tf));
    burnTorch(dt);
  }
  drawFrame();
}

function startGame(){
  resize();newGame();
  log("Click objects in the room list to interact. Select a verb, then click an object.",'sys');
  log("For USE: click USE → select item from inventory → click target object.",'sys');
}

// Boot
let started=false;
document.addEventListener('click',()=>{if(!started){started=true;startGame();}},{once:true});
// Pre-init state so renderer has something
G={ep:1,room:'gatehouse',inv:[],torch:100,extra_torch:0,dead:false,won:false,turns:0,active_verb:'look',sel_item:null,sel_obj:null,has_lantern:false,taken:new Set(),chapel_prog:0,chapel_done:false,crypt_open:false,oracle_solved:false,dragon_dead:false,bridge_paid:false,mirror_used:false,chest_open:false,talimar_bound:false,ritual_timer:0,ritual_on:false,river_crossed:false,mill_jammed:false,cabinet_open:false,fire_out:false,web_burned:false,spider_dead:false,raven_freed:false,snake_freed:false,malach_material:false,malach_bound:false};
resize();
requestAnimationFrame(ts=>{lastT=ts;loop(ts);});
</script>
